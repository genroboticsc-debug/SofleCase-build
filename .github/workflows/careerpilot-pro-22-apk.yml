name: CareerPilot Pro 2.3 Core Recovery APK

on:
  push:
    branches:
      - careerpilot-pro-v1-20260803
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct exact 2.2 baseline
        shell: bash
        run: |
          set -euxo pipefail
          LOG="$GITHUB_WORKSPACE/careerpilot-pro-23-build.log"
          SOURCE="CareerPilotAI_Pro_2.0.0_source.tar.xz"
          cat careerpilot_build/pro_v2/chunks/part{00..23} > "$SOURCE"
          echo "8801d9153864d3da6d90075fbda17c49b84d2a427d2349baf32551370e767b24  $SOURCE" | sha256sum -c - | tee "$LOG"
          mkdir -p build-src
          tar -xJf "$SOURCE" -C build-src
          python careerpilot_build/pro_v2/apply_compiler_fixes.py | tee -a "$LOG"
          python careerpilot_build/pro_v2/apply_compiler_fixes_2.py | tee -a "$LOG"

          cat > expected-v22-chunks.sha256 <<'HASHES'
          815471a48bae55e023550653aa50a1bf8d29710eafde3fc02d448972d4944aa0  careerpilot_build/pro_v22_patch/part00.b64
          c23e51b667b5973700628c03c6392f760e519d0c39794b0019c75c60e777f498  careerpilot_build/pro_v22_patch/part01.b64
          d30817c723ccc997ce335b69cab33387188c533b82e43bd7378d944ba514aa31  careerpilot_build/pro_v22_patch/part02.b64
          492a5d089fa3501c2907045825eed5020780d7bdc277b3485f94f73f2013c7ae  careerpilot_build/pro_v22_patch/part03.b64
          8fe06c95d81899a411461c8275b400f103ff4bb0c7b785237ecd90d617dde3cd  careerpilot_build/pro_v22_patch/part04.b64
          HASHES
          sha256sum -c expected-v22-chunks.sha256 | tee -a "$LOG"
          cat careerpilot_build/pro_v22_patch/part{00..04}.b64 > careerpilot-22.patch.xz.b64
          echo "a96b940b66a7bfb30a1447eb8d60acf149d2978d1f92dac086f4ecc0655c2811  careerpilot-22.patch.xz.b64" | sha256sum -c - | tee -a "$LOG"
          base64 -d careerpilot-22.patch.xz.b64 > careerpilot-22.patch.xz
          echo "0eac18187e9688ad8979c0db32f5e09382332214f87f186b0d404400a1c58320  careerpilot-22.patch.xz" | sha256sum -c - | tee -a "$LOG"
          xz -dc careerpilot-22.patch.xz > careerpilot-22.patch
          echo "f3e4a974ce1731ab7f9227bcf7c1f0a37cb0c678ad88f25f3d0783b5a04f13f4  careerpilot-22.patch" | sha256sum -c - | tee -a "$LOG"
          cd build-src/CareerPilotAI
          patch -p4 --forward --batch < "$GITHUB_WORKSPACE/careerpilot-22.patch" | tee -a "$LOG"
          grep -q 'versionName = "2.2.0-beta"' app/build.gradle.kts

      - name: Verify and apply 2.3 recovery patch
        shell: bash
        run: |
          set -euxo pipefail
          LOG="$GITHUB_WORKSPACE/careerpilot-pro-23-build.log"
          cat > expected-v23-chunks.sha256 <<'HASHES'
          07006dc25f4bc0ee4e5eb837b71e4b06fe71c2426d9498184d25fbd4bee5e16e  careerpilot_build/pro_v23_patch/part00.b64
          f2ab58794f518921102d86b304f2e240af710746388968417bd3911d1a45c956  careerpilot_build/pro_v23_patch/part01.b64
          149776b9314ecffbf08fbbcb74f93d78465e54ee2e446292c7f43ca28a95f5a4  careerpilot_build/pro_v23_patch/part02.b64
          62e5cd7707b8dfcd0994f7cad78ee4187312b38253d3ca857011095920252fce  careerpilot_build/pro_v23_patch/part03.b64
          33adc64474864b2120c74701b3cae81d88827694d62d1628103de312cfa6e2aa  careerpilot_build/pro_v23_patch/part04.b64
          HASHES
          sha256sum -c expected-v23-chunks.sha256 | tee -a "$LOG"
          cat careerpilot_build/pro_v23_patch/part{00..04}.b64 > careerpilot-23.patch.xz.b64
          echo "27d032546b249e190e7c6dbfb6d4e9f53c3d000c763198f91de9349dedb8cd92  careerpilot-23.patch.xz.b64" | sha256sum -c - | tee -a "$LOG"
          base64 -d careerpilot-23.patch.xz.b64 > careerpilot-23.patch.xz
          echo "6a76da41686e4ec56b91e30179e71220f19cafd7e7db6e5f5a1580edf74ed575  careerpilot-23.patch.xz" | sha256sum -c - | tee -a "$LOG"
          xz -dc careerpilot-23.patch.xz > careerpilot-23.patch
          echo "ad600e430e4c0785e01e00215494eecbf8732f5e80a4371de4b5f1f5cd185589  careerpilot-23.patch" | sha256sum -c - | tee -a "$LOG"
          cd build-src/CareerPilotAI
          patch -p2 --forward --batch < "$GITHUB_WORKSPACE/careerpilot-23.patch" | tee -a "$LOG"
          grep -q 'versionName = "2.3.0-core-recovery"' app/build.gradle.kts
          grep -q 'class ProfessionalPdfRenderer' app/src/main/java/com/careerpilot/ai/data/ProfessionalPdfRenderer.kt
          grep -q 'object RoleMatchScorer' app/src/main/java/com/careerpilot/ai/discovery/JobQuality.kt
          grep -q 'fun putSecret' app/src/main/java/com/careerpilot/ai/security/SecretStore.kt
          grep -q 'prepareAfterMatch' app/src/main/java/com/careerpilot/ai/workflow/WorkflowEngine.kt

      - name: Smoke-test public job routes
        shell: bash
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/careerpilot-pro-23-build.log"
          ok=0
          for url in \
            'https://remotive.com/api/remote-jobs?search=mechanical&limit=1' \
            'https://jobicy.com/api/v2/remote-jobs?count=1&tag=engineering' \
            'https://remoteok.com/api' \
            'https://www.arbeitnow.com/api/job-board-api'; do
            code=$(curl -L --max-time 20 -A 'CareerPilotAI/2.3' -o /tmp/feed.out -s -w '%{http_code}' "$url")
            bytes=$(wc -c < /tmp/feed.out 2>/dev/null || echo 0)
            echo "SEARCH_ROUTE http=$code bytes=$bytes url=$url" | tee -a "$LOG"
            if [[ "$code" == "200" && "$bytes" -gt 50 ]]; then ok=$((ok+1)); fi
          done
          echo "SEARCH_ROUTES_AVAILABLE=$ok/4" | tee -a "$LOG"
          test "$ok" -ge 3

      - name: Build unit tests and APK
        working-directory: build-src/CareerPilotAI
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug 2>&1 | tee -a "$GITHUB_WORKSPACE/careerpilot-pro-23-build.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          cp build-src/CareerPilotAI/app/build/outputs/apk/debug/app-debug.apk CareerPilotAI-Pro-2.3-Core-Recovery.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          {
            echo '=== APK SIGNATURE ==='
            "$APKSIGNER" verify --verbose --print-certs CareerPilotAI-Pro-2.3-Core-Recovery.apk
            echo '=== APK PACKAGE METADATA ==='
            "$AAPT" dump badging CareerPilotAI-Pro-2.3-Core-Recovery.apk
            echo '=== APK SHA256 ==='
            sha256sum CareerPilotAI-Pro-2.3-Core-Recovery.apk
            echo '=== APK ZIP INTEGRITY ==='
            unzip -t CareerPilotAI-Pro-2.3-Core-Recovery.apk | tail -n 2
          } | tee CareerPilotAI-Pro-2.3-Core-Recovery.validation.txt | tee -a careerpilot-pro-23-build.log
          sha256sum CareerPilotAI-Pro-2.3-Core-Recovery.apk > CareerPilotAI-Pro-2.3-Core-Recovery.apk.sha256

      - name: Package source
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          tar --exclude='.gradle' --exclude='**/build' -cJf CareerPilotAI-Pro-2.3-Core-Recovery-source.tar.xz -C build-src CareerPilotAI
          sha256sum CareerPilotAI-Pro-2.3-Core-Recovery-source.tar.xz > CareerPilotAI-Pro-2.3-Core-Recovery-source.tar.xz.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-2.3-build-diagnostics
          path: careerpilot-pro-23-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload APK and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-2.3-Core-Recovery
          path: |
            CareerPilotAI-Pro-2.3-Core-Recovery.apk
            CareerPilotAI-Pro-2.3-Core-Recovery.apk.sha256
            CareerPilotAI-Pro-2.3-Core-Recovery.validation.txt
            CareerPilotAI-Pro-2.3-Core-Recovery-source.tar.xz
            CareerPilotAI-Pro-2.3-Core-Recovery-source.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1
