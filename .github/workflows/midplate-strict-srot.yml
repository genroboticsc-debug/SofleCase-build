name: Midplate Strict SROT Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: validation_run/requirements.txt

      - name: Decode and verify strict package
        shell: bash
        run: |
          set -euxo pipefail
          cat validation_payload/strict_bundle.part* > /tmp/strict_bundle.b64
          base64 --decode /tmp/strict_bundle.b64 > /tmp/strict_bundle.zip
          echo "6389f7383a5f0f16f40021e455ca8589b0941a8bfff4ce20a9f60126acaa66d3  /tmp/strict_bundle.zip" | sha256sum --check --strict
          mkdir -p /tmp/strict_extract
          unzip -q /tmp/strict_bundle.zip -d /tmp/strict_extract
          mv /tmp/strict_extract/Dilemma_Midplate_Strict_SROT validation_run

      - name: Fetch immutable authoritative geometry
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/Bastardkb/Dilemma/main/mechanical/cases/3x5_3_hotswap/midplate.dxf \
            --output validation_run/source/midplate.dxf
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/Bastardkb/Dilemma/af0286154cd09af451bc475aabfbe1807123da26/mechanical/cases/3x5_3_hotswap/midplate.stl \
            --output validation_run/source/midplate_official.stl
          test "$(sha256sum validation_run/source/midplate.dxf | awk '{print $1}')" = "9d69982ed6ff6aa0fd99384820820adf5885e06e0289844d2528d5b10d398d1b"

      - name: Install exact CAD dependencies
        working-directory: validation_run
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --requirement requirements.txt
          python -m pip freeze | tee validation/dependency_freeze.txt
          python - <<'PY'
          import build123d
          import OCP
          import ezdxf
          import trimesh
          print("build123d", getattr(build123d, "__version__", "unknown"))
          print("OCP", getattr(OCP, "__version__", "unknown"))
          print("ezdxf", ezdxf.__version__)
          print("trimesh", trimesh.__version__)
          PY

      - name: Run fresh strict SROT and geometric validation
        working-directory: validation_run
        shell: bash
        run: |
          set -euxo pipefail
          python run_all.py --thickness 3.0 2>&1 | tee validation/complete_run.log
          grep -Fx "FINAL_RESULT=PASS" validation/complete_run.log
          grep -Fx "STRICT_SROT=PASS" validation/complete_run.log
          grep -Fx "GEOMETRY_VALIDATION=PASS" validation/complete_run.log

      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-midplate-strict-srot-evidence
          path: |
            validation_run/reference
            validation_run/generated
            validation_run/validation
            validation_run/scripts
            validation_run/source/geometry_manifest.json
            validation_run/requirements.txt
            validation_run/README.md
          if-no-files-found: warn
          retention-days: 30
