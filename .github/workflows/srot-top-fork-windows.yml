name: SROT top-fork exact Windows-font validation
on:
  pull_request:
    paths:
      - 'srot_top_fork_windows_marker.txt'
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CAD runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1 cadquery-ocp-novtk==7.9.3.1.1 trimesh==4.11.1 manifold3d==3.5.2
      - name: Fetch exact reference
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/gusmanb/logicanalyzer/4e8d9ec9fff592f7bb84490d8e301061a36e7f22/Enclosure/LogicAnalyzer_JasonYANG170/AnalyzerBoxTop_fork.STL' -OutFile 'AnalyzerBoxTop_fork.STL'
      - name: Build and validate variants
        shell: pwsh
        run: |
          python srot_top_fork_windows_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: srot-top-fork-windows-results
          path: top_fork_windows_results
          retention-days: 1
