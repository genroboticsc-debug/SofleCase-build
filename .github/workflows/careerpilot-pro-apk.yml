name: CareerPilot Pro Android APK

on:
  push:
    branches:
      - careerpilot-pro-v1-20260803
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reassemble and verify upgraded source
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== SOURCE SEGMENT SHA256 ==='
            sha256sum careerpilot_build/pro_v1/part*
            echo '=== EXPECTED SOURCE SEGMENT SHA256 ==='
            cat <<'HASHES'
          e821865034e74428ae72c88e9e0d396206f75f431a90490df5929dcc28efebc2  careerpilot_build/pro_v1/part00
          b196f52d76a10db12d4c155c48e1aea12b22cf4cba9e952af0abd025e9d290a2  careerpilot_build/pro_v1/part01
          4a5776d9d9dc4a16b47282e21714c0db66481a99999df7c1c882ef5e0dd86fe0  careerpilot_build/pro_v1/part02
          2be1bb41b9d42653a51139ec744281990f65a335ad31de742867dbc8884b878a  careerpilot_build/pro_v1/part03
          085c8c27fe52c8c9ff04c070e225a19ad53f8e07ecb4e42ec7fcc3b141c2ef95  careerpilot_build/pro_v1/part04
          f73c4ff0ef456bfe86a5714aa06eeb848f6a3708c96f133fdfef1af2ca49327b  careerpilot_build/pro_v1/part05
          5dad5008f39a39520663b27fe55852cd0de1940782a98f5dd14b3c7dfc21c515  careerpilot_build/pro_v1/part06
          a0b9cf5cc4f3fcb21c0b80b1d7c2dbba52cfb6de66c8b5ce9dd51822755802f9  careerpilot_build/pro_v1/part07
          0ca0b10d15518297ded192375c615cba7dfbac5696d3584a52ef10903e88c77e  careerpilot_build/pro_v1/part08
          534761e24e1c686f42994b2e8fdb08f17b0210be66e5607677fb632980f53482  careerpilot_build/pro_v1/part09
          63c09fd4308238544673552bd6b71db0cce95933727fdd6865ee8debcf122b07  careerpilot_build/pro_v1/part10
          a2b4bf1a7defd89d8f0855da5957384ac8c2d62504e9cdaed5affa449469b027  careerpilot_build/pro_v1/part11
          b496f7303c995306020fe565278f3174139dadb61b59897ab5bc3bb1ed5e847a  careerpilot_build/pro_v1/part12
          HASHES
            echo '=== SOURCE SEGMENT VERIFICATION ==='
            cat > expected-segments.sha256 <<'HASHES'
          e821865034e74428ae72c88e9e0d396206f75f431a90490df5929dcc28efebc2  careerpilot_build/pro_v1/part00
          b196f52d76a10db12d4c155c48e1aea12b22cf4cba9e952af0abd025e9d290a2  careerpilot_build/pro_v1/part01
          4a5776d9d9dc4a16b47282e21714c0db66481a99999df7c1c882ef5e0dd86fe0  careerpilot_build/pro_v1/part02
          2be1bb41b9d42653a51139ec744281990f65a335ad31de742867dbc8884b878a  careerpilot_build/pro_v1/part03
          085c8c27fe52c8c9ff04c070e225a19ad53f8e07ecb4e42ec7fcc3b141c2ef95  careerpilot_build/pro_v1/part04
          f73c4ff0ef456bfe86a5714aa06eeb848f6a3708c96f133fdfef1af2ca49327b  careerpilot_build/pro_v1/part05
          5dad5008f39a39520663b27fe55852cd0de1940782a98f5dd14b3c7dfc21c515  careerpilot_build/pro_v1/part06
          a0b9cf5cc4f3fcb21c0b80b1d7c2dbba52cfb6de66c8b5ce9dd51822755802f9  careerpilot_build/pro_v1/part07
          0ca0b10d15518297ded192375c615cba7dfbac5696d3584a52ef10903e88c77e  careerpilot_build/pro_v1/part08
          534761e24e1c686f42994b2e8fdb08f17b0210be66e5607677fb632980f53482  careerpilot_build/pro_v1/part09
          63c09fd4308238544673552bd6b71db0cce95933727fdd6865ee8debcf122b07  careerpilot_build/pro_v1/part10
          a2b4bf1a7defd89d8f0855da5957384ac8c2d62504e9cdaed5affa449469b027  careerpilot_build/pro_v1/part11
          b496f7303c995306020fe565278f3174139dadb61b59897ab5bc3bb1ed5e847a  careerpilot_build/pro_v1/part12
          HASHES
            sha256sum -c expected-segments.sha256
            cat careerpilot_build/pro_v1/part* > CareerPilotAI_Pro_1.0.0_source.b64
            base64 --decode CareerPilotAI_Pro_1.0.0_source.b64 > CareerPilotAI_Pro_1.0.0_source.zip
            echo '=== RECONSTRUCTED SOURCE SHA256 ==='
            sha256sum CareerPilotAI_Pro_1.0.0_source.zip
            echo "ac9e4f427bbb47d784a262c2319f67582a11a75dae3530742402172939dde185  CareerPilotAI_Pro_1.0.0_source.zip" | sha256sum -c -
            unzip -q CareerPilotAI_Pro_1.0.0_source.zip -d build-src
            test -f build-src/CareerPilotAI/settings.gradle.kts
            test -f build-src/CareerPilotAI/app/build.gradle.kts
          } 2>&1 | tee careerpilot-pro-build.log

      - name: Build, test and package APK
        working-directory: build-src/CareerPilotAI
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug 2>&1 | tee -a "$GITHUB_WORKSPACE/careerpilot-pro-build.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euxo pipefail
          cp build-src/CareerPilotAI/app/build/outputs/apk/debug/app-debug.apk CareerPilotAI-Pro.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          {
            echo '=== APK SIGNATURE ==='
            "$APKSIGNER" verify --verbose --print-certs CareerPilotAI-Pro.apk
            echo '=== APK PACKAGE METADATA ==='
            "$AAPT" dump badging CareerPilotAI-Pro.apk
            echo '=== APK SHA256 ==='
            sha256sum CareerPilotAI-Pro.apk
          } | tee CareerPilotAI-Pro.validation.txt | tee -a careerpilot-pro-build.log
          sha256sum CareerPilotAI-Pro.apk > CareerPilotAI-Pro.apk.sha256

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-build-diagnostics
          path: careerpilot-pro-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-Android-APK
          path: |
            CareerPilotAI-Pro.apk
            CareerPilotAI-Pro.apk.sha256
            CareerPilotAI-Pro.validation.txt
          if-no-files-found: error
          retention-days: 1
