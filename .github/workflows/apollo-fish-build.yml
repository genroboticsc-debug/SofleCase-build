name: Apollo Fish Android APK

on:
  push:
    branches:
      - chatgpt/apollo-fish-apk
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat .apollo-fish/chunk00.b64 .apollo-fish/chunk12.b64 .apollo-fish/chunk34.b64 .apollo-fish/chunk56.b64 | base64 -d > /tmp/ApolloFishAndroid-buildsrc.tar.gz
          echo "5c6ab941acf00c2bb6b2a263205089c13b6a17c6ae7a5c808ea9793850073190  /tmp/ApolloFishAndroid-buildsrc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ApolloFishAndroid-buildsrc.tar.gz -C /tmp
          test -f /tmp/ApolloFishAndroid/app/build.gradle.kts
          test -f /tmp/ApolloFishAndroid/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: /tmp/ApolloFishAndroid
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          SRC=/tmp/ApolloFishAndroid/app/build/outputs/apk/debug/app-debug.apk
          OUT=/tmp/apolloFish-debug.apk
          test -s "$SRC"
          cp "$SRC" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$OUT" | tee /tmp/apolloFish-badging.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/apolloFish-signature.txt
          sha256sum "$OUT" | tee /tmp/apolloFish-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: apolloFish-debug-apk
          path: |
            /tmp/apolloFish-debug.apk
            /tmp/apolloFish-debug.apk.sha256
            /tmp/apolloFish-badging.txt
            /tmp/apolloFish-signature.txt
          if-no-files-found: error
          retention-days: 7
