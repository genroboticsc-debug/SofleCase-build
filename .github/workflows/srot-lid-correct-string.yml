name: SROT lid correct-string geometry
on:
  pull_request:
    paths:
      - 'srot_lid_correct_string_marker.txt'
permissions:
  contents: read
jobs:
  generate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft 365 font resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force odt | Out-Null
          Invoke-WebRequest -Uri 'https://officecdn.microsoft.com/pr/wsus/setup.exe' -OutFile 'odt/setup.exe'
          @'
          <Configuration><Add OfficeClientEdition="64" Channel="Current"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Access" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Groove" /><ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="Word" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Property Name="AUTOACTIVATE" Value="0" /></Configuration>
          '@ | Set-Content -Encoding utf8 odt/config.xml
          Start-Process -FilePath "$PWD/odt/setup.exe" -ArgumentList '/configure', "$PWD/odt/config.xml" -Wait -NoNewWindow
          if (-not (Test-Path 'C:\Windows\Fonts\GOTHIC.TTF')) { throw 'Century Gothic unavailable' }
      - name: Install CAD runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1
      - name: Generate correct text geometry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          @'
          from pathlib import Path
          from build123d import Align, FontStyle, Text, export_stl, extrude
          out=Path('output')
          fonts={'regular':Path(r'C:\Windows\Fonts\GOTHIC.TTF'),'bold':Path(r'C:\Windows\Fonts\GOTHICB.TTF')}
          strings=['Logic AnalyZer','Logic Analyzer','logicAnalyzer','LogicAnalyzer']
          rows=[]
          for style,font in fonts.items():
              for text in strings:
                  face=Text(text,10.0,font_path=str(font),font_style=FontStyle.REGULAR,align=(Align.MIN,Align.MIN))
                  solid=extrude(face,1.0)
                  name=f'{style}__{text.replace(" ","_")}.stl'
                  export_stl(solid,out/name,tolerance=0.002,angular_tolerance=0.04)
                  bb=solid.bounding_box()
                  rows.append(f'{name},{solid.volume:.12f},{bb.min.X:.12f},{bb.min.Y:.12f},{bb.max.X:.12f},{bb.max.Y:.12f}')
          (out/'inventory.csv').write_text('file,volume,xmin,ymin,xmax,ymax\n'+'\n'.join(rows)+'\n',encoding='utf-8')
          '@ | Set-Content -Encoding utf8 generate.py
          python generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: srot-lid-correct-string-geometry
          path: output
          retention-days: 1
