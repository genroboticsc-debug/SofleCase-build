name: Dilemma P314 upstream CAD history audit

on:
  pull_request:
    branches: [master]
    paths:
      - .github/dilemma-p314-trackpad-trigger.txt

permissions:
  contents: read

jobs:
  audit-history:
    runs-on: ubuntu-latest
    steps:
      - name: Audit exact upstream history for authored CAD sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Bastardkb/Dilemma.git upstream
          cd upstream
          test "$(sha256sum mechanical/trackpad/35mm/bottom2.stl | awk '{print $1}')" = "4519a8dd4853234d42329682c657039d99e89d03293d9e517b9586b1100195dd"
          mkdir -p ../artifact/blobs
          git log --all --full-history --name-status -- mechanical/trackpad mechanical/cases > ../artifact/PATH_HISTORY.txt
          git log --all --format='%H %cI %s' > ../artifact/COMMIT_HISTORY.txt
          python3 - <<'PY'
          import pathlib, subprocess, re, hashlib
          out = pathlib.Path('../artifact')
          exts = {'.fcstd','.f3d','.step','.stp','.scad','.blend','.sldprt','.sldasm','.3mf','.iges','.igs','.brep','.dxf','.svg','.py'}
          keywords = ('trackpad','procyon','holder','hider','spacer','bottom2','35mm','40mm')
          rows=[]; recovered={}
          commits=subprocess.check_output(['git','rev-list','--all'],text=True).splitlines()
          for commit in commits:
              listing=subprocess.check_output(['git','ls-tree','-r',commit],text=True,errors='replace').splitlines()
              for line in listing:
                  meta,path=line.split('\t',1)
                  mode,typ,blob=meta.split()
                  pl=path.lower()
                  if any(k in pl for k in keywords) and pathlib.PurePosixPath(pl).suffix in exts:
                      rows.append((commit,blob,path))
                      if blob not in recovered:
                          data=subprocess.check_output(['git','cat-file','blob',blob])
                          safe=re.sub(r'[^A-Za-z0-9._-]+','_',path)
                          dest=out/'blobs'/f'{blob}__{safe}'
                          dest.write_bytes(data)
                          recovered[blob]=(path,len(data),hashlib.sha256(data).hexdigest())
          (out/'CAD_HISTORY_INVENTORY.tsv').write_text('\n'.join('\t'.join(r) for r in rows)+'\n')
          (out/'RECOVERED_BLOBS.tsv').write_text('\n'.join(f'{b}\t{p}\t{n}\t{h}' for b,(p,n,h) in recovered.items())+'\n')
          # Search all historical text blobs for the engraving and major feature labels.
          hits=[]
          for commit in commits:
              for term in ('51_4v','bottom2','ProcyonHolder','trackpad_35mm'):
                  cp=subprocess.run(['git','grep','-I','-n','-F',term,commit,'--'],text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
                  if cp.stdout: hits.append(f'### {commit} {term}\n{cp.stdout}')
          (out/'HISTORICAL_TEXT_HITS.txt').write_text('\n'.join(hits))
          PY
          find ../artifact -type f -print0 | sort -z | xargs -0 sha256sum > ../artifact/SHA256SUMS.txt
          cat ../artifact/RECOVERED_BLOBS.tsv
      - name: Upload audited history
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-p314-authored-cad-history
          path: artifact/
          if-no-files-found: error
          retention-days: 1
