name: SROT dependency bundle extra

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  wheelhouse-extra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download complete pinned runtime wheel set
        run: |
          python -m pip install --upgrade pip
          mkdir wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse \
            anytree==2.13.0 \
            ipython==9.4.0 \
            scikit-learn==1.7.1 \
            scipy==1.16.1 \
            sympy==1.14.0 \
            fonttools==4.59.0 \
            pyparsing==3.2.3 \
            svgwrite==1.4.3 \
            setuptools==80.9.0 \
            numpy==2.3.5 \
            requests==2.32.4 \
            typing-extensions==4.14.1
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS_EXTRA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: srot-python313-wheelhouse-extra-complete
          path: wheelhouse/
          retention-days: 1
