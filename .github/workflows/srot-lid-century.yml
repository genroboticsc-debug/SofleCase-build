name: SROT lid GDI weight fit
on:
  pull_request:
    paths:
      - 'srot_lid_century_marker.txt'
permissions:
  contents: read
jobs:
  fit:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft 365 font resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force odt | Out-Null
          Invoke-WebRequest -Uri 'https://officecdn.microsoft.com/pr/wsus/setup.exe' -OutFile 'odt/setup.exe'
          @'
          <Configuration><Add OfficeClientEdition="64" Channel="Current"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Access" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Groove" /><ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="Word" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Property Name="AUTOACTIVATE" Value="0" /></Configuration>
          '@ | Set-Content -Encoding utf8 odt/config.xml
          Start-Process -FilePath "$PWD/odt/setup.exe" -ArgumentList '/configure', "$PWD/odt/config.xml" -Wait -NoNewWindow
          if (-not (Test-Path 'C:\Windows\Fonts\GOTHIC.TTF')) { throw 'Century Gothic unavailable' }
      - name: Install pinned CAD and Boolean runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1 trimesh==4.11.1 manifold3d==3.5.2
      - name: Fetch exact reference
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/gusmanb/logicanalyzer/4e8d9ec9fff592f7bb84490d8e301061a36e7f22/Enclosure/AnalyzerBox_Lid.STL' -OutFile 'AnalyzerBox_Lid.STL'
      - name: Decode and run exact GDI outline sweep
        shell: pwsh
        run: |
          @'
          
          '@ | Set-Content -NoNewline fit_lid_gdi.py.gz.b64
          python -c "import base64,gzip,pathlib; pathlib.Path('fit_lid_gdi.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('fit_lid_gdi.py.gz.b64').read_text())))"
          python fit_lid_gdi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srot-lid-gdi-weight-fit
          path: lid_gdi_fit_results
          retention-days: 1
