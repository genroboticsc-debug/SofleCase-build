name: Recover Dilemma P018-P022 history

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/recover-dilemma-p018-p022-history.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every reachable ref
        run: git fetch --all --prune --tags --force
      - name: Recover unique historical scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/direct recovery/embedded recovery/inventory recovery/unique
          git rev-list --all --objects > recovery/inventory/all_objects.txt
          awk 'NF>1 && $0 ~ /(dilemma_3x5_3_hotswap_bottom\.py|dilemma_3x5_3_hotswap_plate_left\.py|dilemma_3x5_3_hotswap_plate_right\.py)$/ {print}' recovery/inventory/all_objects.txt > recovery/inventory/direct_hits.txt
          while read -r blob path; do
            [ -n "${blob:-}" ] || continue
            safe=$(printf '%s' "$path" | tr '/ :' '___')
            git cat-file blob "$blob" > "recovery/direct/${blob}_${safe}"
          done < recovery/inventory/direct_hits.txt

          : > recovery/inventory/seen_stems.txt
          while IFS= read -r commit; do
            mapfile -t parts < <(git ls-tree -r --name-only "$commit" | grep -E '\.b64\.part-[0-9]+$' | sort || true)
            ((${#parts[@]})) || continue
            mapfile -t stems < <(printf '%s\n' "${parts[@]}" | sed -E 's/\.part-[0-9]+$//' | sort -u)
            for stem in "${stems[@]}"; do
              key="$commit $stem"
              grep -qxF "$key" recovery/inventory/seen_stems.txt && continue
              echo "$key" >> recovery/inventory/seen_stems.txt
              mapfile -t group < <(printf '%s\n' "${parts[@]}" | grep -F "${stem}.part-" | sort)
              work=$(mktemp -d)
              : > "$work/payload.b64"
              for p in "${group[@]}"; do git show "$commit:$p" >> "$work/payload.b64"; done
              tr -d '\r\n ' < "$work/payload.b64" | base64 -d > "$work/payload" 2>/dev/null || { rm -rf "$work"; continue; }
              mkdir -p "$work/extracted"
              tar -xf "$work/payload" -C "$work/extracted" 2>/dev/null || { rm -rf "$work"; continue; }
              mapfile -t targets < <(find "$work/extracted" -type f \( -name 'dilemma_3x5_3_hotswap_bottom.py' -o -name 'dilemma_3x5_3_hotswap_plate_left.py' -o -name 'dilemma_3x5_3_hotswap_plate_right.py' \) | sort)
              for t in "${targets[@]}"; do
                hash=$(sha256sum "$t" | awk '{print $1}')
                base=$(basename "$t")
                if [ ! -e "recovery/unique/${hash}_${base}" ]; then
                  cp "$t" "recovery/unique/${hash}_${base}"
                  printf '%s %s %s\n' "$hash" "$commit" "$t" >> recovery/inventory/unique_sources.txt
                fi
              done
              rm -rf "$work"
            done
          done < <(git rev-list --all | sort -u)
          find recovery -type f -print0 | sort -z | xargs -0 sha256sum > recovery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dilemma-p018-p022-history
          path: recovery/
          compression-level: 0
          retention-days: 1
