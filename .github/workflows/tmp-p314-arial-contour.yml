name: Temporary P314 Arial contour retrieval

on:
  pull_request:
    branches: [master]
    paths:
      - .github/p314-arial-trigger.txt

permissions:
  contents: read

jobs:
  fetch-arial:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Microsoft Core Fonts Arial package
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cabextract wget
          mkdir -p fonts
          wget --tries=5 --timeout=30 -O arial32.exe https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -d fonts arial32.exe
          sha256sum arial32.exe fonts/* | sort > fonts/SHA256SUMS.txt
          cat fonts/SHA256SUMS.txt
      - name: Upload internal validation font
        uses: actions/upload-artifact@v4
        with:
          name: p314-arial-contour-validation
          path: fonts/
          if-no-files-found: error
          retention-days: 1
