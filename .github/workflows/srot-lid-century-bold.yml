name: SROT lid Century Gothic Bold geometry
on:
  pull_request:
    paths:
      - 'srot_lid_century_bold_marker.txt'
permissions:
  contents: read
jobs:
  generate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft 365 font resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force odt | Out-Null
          Invoke-WebRequest -Uri 'https://officecdn.microsoft.com/pr/wsus/setup.exe' -OutFile 'odt/setup.exe'
          @'
          <Configuration><Add OfficeClientEdition="64" Channel="Current"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Access" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Groove" /><ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="Word" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Property Name="AUTOACTIVATE" Value="0" /></Configuration>
          '@ | Set-Content -Encoding utf8 odt/config.xml
          Start-Process -FilePath "$PWD/odt/setup.exe" -ArgumentList '/configure', "$PWD/odt/config.xml" -Wait -NoNewWindow
          if (-not (Test-Path 'C:\Windows\Fonts\GOTHICB.TTF')) { throw 'Century Gothic Bold was not installed' }
      - name: Install CAD runtime
        shell: pwsh
        run: python -m pip install build123d==0.11.1
      - name: Generate exact bold engraving geometry only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force generated_lid_text_bold | Out-Null
          @'
          from pathlib import Path
          from build123d import Align, Axis, FontStyle, Location, Matrix, Text, export_stl, extrude
          out=Path('generated_lid_text_bold');font=Path(r'C:\Windows\Fonts\GOTHICB.TTF')
          x0,x1=10.204837799072266,54.57022476196289;z0,z1=13.055909156799316,18.99821662902832
          tw,th=x1-x0,z1-z0
          probe=Text('Logic Analyzer',10,font_path=str(font),font_style=FontStyle.REGULAR,align=(Align.MIN,Align.MIN))
          base=10*th/probe.bounding_box().size.Y
          for i in range(41):
              size=base-0.04+i*0.002
              sketch=Text('Logic Analyzer',size,font_path=str(font),font_style=FontStyle.REGULAR,align=(Align.MIN,Align.MIN))
              for mode in ('natural','envelope'):
                  s=sketch
                  if mode=='envelope':
                      bb=s.bounding_box();s=s.transform_geometry(Matrix([[tw/bb.size.X,0,0,0],[0,th/bb.size.Y,0,0],[0,0,1,0]]))
                  solid=extrude(s,1).rotate(Axis.X,-90);bb=solid.bounding_box();solid=solid.moved(Location((x0-bb.min.X,14-bb.min.Y,z0-bb.min.Z)))
                  export_stl(solid,out/f'century_bold_{mode}_{size:.6f}.stl',tolerance=.002,angular_tolerance=.05)
          '@ | Set-Content -Encoding utf8 make.py
          python make.py
      - uses: actions/upload-artifact@v4
        with:
          name: srot-lid-century-bold-text-geometry
          path: generated_lid_text_bold
          retention-days: 1
