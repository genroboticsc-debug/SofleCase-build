name: Immutable top IMeshTools final-solid diagnostic

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmp-top-srot-immutable-validation.yml
      - tmp_top_validation/diagnose_imeshtools_final_solid.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out immutable recovered source commit
        uses: actions/checkout@v4
        with:
          ref: cc3523043a98f97d5a7938e48cdbb947990f4a09
          fetch-depth: 1

      - name: Inject frozen IMeshTools diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin tmp/top-engraving-frozen-validation-20260805
          git show FETCH_HEAD:tmp_top_validation/diagnose_imeshtools_final_solid.py > tmp_top_validation/diagnose_imeshtools_final_solid.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tmp_top_validation/requirements.txt

      - name: Install checksum-verified Arial and pinned CAD stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fontconfig cabextract curl xz-utils
          FONT_TMP="$(mktemp -d)"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 -o "$FONT_TMP/arial32.exe" https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q -d "$FONT_TMP" "$FONT_TMP/arial32.exe"
          test "$(sha256sum "$FONT_TMP/Arial.TTF" | awk '{print $1}')" = "35c0f3559d8db569e36c31095b8a60d441643d95f59139de40e23fada819b833"
          install -Dm644 "$FONT_TMP/Arial.TTF" "$HOME/.local/share/fonts/Arial.ttf"
          fc-cache -f
          fc-match Arial | grep -qi Arial
          python -m pip install --upgrade pip
          python -m pip install -r tmp_top_validation/requirements.txt
          python -m pip install networkx==3.6.1

      - name: Install recovered feature-tree migrations and run strict SROT
        shell: bash
        run: |
          set -euxo pipefail
          python tmp_top_validation/apply_explicit_boolean_tree_fix.py
          python tmp_top_validation/apply_f005_boolean_tolerance_fix.py
          python tmp_top_validation/apply_f012_all_faces_fix.py
          python tmp_top_validation/apply_f012_font_size_fix.py
          python tmp_top_validation/apply_f012_lowercase_v_fix.py
          python -m py_compile \
            tmp_top_validation/top_parametric.py \
            tmp_top_validation/strict_srot_check.py \
            tmp_top_validation/diagnose_imeshtools_final_solid.py
          python tmp_top_validation/strict_srot_check.py
          git diff --check

      - name: Run OCCT IMeshTools topology matrix
        shell: bash
        run: |
          set -o pipefail
          rm -rf tmp_top_validation/generated/imeshtools_diagnostic
          python tmp_top_validation/diagnose_imeshtools_final_solid.py 2>&1 | tee tmp_top_validation/imeshtools_diagnostic.log

      - name: Upload IMeshTools diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-top-imeshtools-diagnostic-${{ github.run_id }}
          path: |
            tmp_top_validation/generated/imeshtools_diagnostic/**
            tmp_top_validation/imeshtools_diagnostic.log
            tmp_top_validation/strict_srot_report.json
          if-no-files-found: warn
