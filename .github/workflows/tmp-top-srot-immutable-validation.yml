# Direct final-solid native tessellation audit 2026-08-05T05:58+05:30
name: Immutable top direct final-solid tessellation audit

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/tmp-top-srot-immutable-validation.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable lowercase-v source commit
        uses: actions/checkout@v4
        with:
          ref: cc3523043a98f97d5a7938e48cdbb947990f4a09

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tmp_top_validation/requirements.txt

      - name: Install checksum-verified Arial and pinned CAD stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fontconfig cabextract curl xz-utils
          FONT_TMP="$(mktemp -d)"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 -o "$FONT_TMP/arial32.exe" https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q -d "$FONT_TMP" "$FONT_TMP/arial32.exe"
          test "$(sha256sum "$FONT_TMP/Arial.TTF" | awk '{print $1}')" = "35c0f3559d8db569e36c31095b8a60d441643d95f59139de40e23fada819b833"
          install -Dm644 "$FONT_TMP/Arial.TTF" "$HOME/.local/share/fonts/Arial.ttf"
          fc-cache -f
          fc-match Arial | grep -qi Arial
          python -m pip install --upgrade pip
          python -m pip install -r tmp_top_validation/requirements.txt

      - name: Reassemble and verify immutable reference STL
        shell: bash
        run: |
          set -euxo pipefail
          REF_DIR=tmp_top_validation/reference
          cat "$REF_DIR"/top.stl.xz.b64.00 "$REF_DIR"/top.stl.xz.b64.01 "$REF_DIR"/top.stl.xz.b64.02 "$REF_DIR"/top.stl.xz.b64.03 "$REF_DIR"/top.stl.xz.b64.04 > "$REF_DIR"/top.stl.xz.b64
          test "$(sha256sum "$REF_DIR"/top.stl.xz.b64 | awk '{print $1}')" = "562abd14f9e3bfdfebac2fcb8c4d2fc8806c007f540f04b3a2aaa319f7a31924"
          base64 --decode "$REF_DIR"/top.stl.xz.b64 > "$REF_DIR"/top.stl.xz
          test "$(sha256sum "$REF_DIR"/top.stl.xz | awk '{print $1}')" = "e646f4a8013e6fe9c31ff379311719f74fb1e6b405fd273c66b6b504258312d0"
          xz --decompress --stdout "$REF_DIR"/top.stl.xz > "$REF_DIR"/top.stl
          test "$(sha256sum "$REF_DIR"/top.stl | awk '{print $1}')" = "d9cd3e5cae398287140e92136a87a7aa1ed6ec4433434fca0cf0b661ca869cac"

      - name: Install final recovered feature tree
        shell: bash
        run: |
          set -euxo pipefail
          python tmp_top_validation/apply_explicit_boolean_tree_fix.py
          python tmp_top_validation/apply_f005_boolean_tolerance_fix.py
          python tmp_top_validation/apply_f012_all_faces_fix.py
          python tmp_top_validation/apply_f012_font_size_fix.py
          python tmp_top_validation/apply_f012_lowercase_v_fix.py
          python -m py_compile \
            tmp_top_validation/top_parametric.py \
            tmp_top_validation/validate_fast_manifold.py \
            tmp_top_validation/validate_feature_tree_manifold.py
          git diff --check

      - name: Audit direct final-solid native tessellation matrix
        shell: bash
        run: |
          set -euxo pipefail
          cd tmp_top_validation
          rm -rf generated/direct_final_solid
          mkdir -p generated/direct_final_solid
          python - <<'PY' 2>&1 | tee generated/direct_final_solid/audit.log
          from __future__ import annotations

          from collections import Counter, defaultdict
          import json
          from pathlib import Path

          import numpy as np
          import trimesh
          from OCP.BRepMesh import BRepMesh_IncrementalMesh
          from OCP.StlAPI import StlAPI_Writer

          import top_parametric as tp
          from validate_fast_manifold import topology_split_reference
          from validate_feature_tree_manifold import as_mesh, mesh_stats, remove_zero_area_faces

          root = Path("generated/direct_final_solid")
          reference_raw = as_mesh(trimesh.load_mesh("reference/top.stl", process=True), "reference")
          reference, ref_audit, ref_checks = topology_split_reference(reference_raw)
          model = tp.build_top()
          if not model.is_valid or len(model.solids()) != 1:
              raise RuntimeError("Final analytic model is not one valid solid")

          def directional(first, second, label):
              result = as_mesh(trimesh.boolean.difference([first, second], engine="manifold", check_volume=True), label)
              return float(abs(result.volume)) if len(result.faces) else 0.0, mesh_stats(result)

          def abnormal_edges(mesh):
              counts = defaultdict(int)
              for tri in np.asarray(mesh.faces, dtype=np.int64):
                  a,b,c=(int(x) for x in tri)
                  for u,v in ((a,b),(b,c),(c,a)):
                      if u>v:u,v=v,u
                      counts[(u,v)] += 1
              hist=Counter(counts.values())
              bad={f"{u},{v}":n for (u,v),n in counts.items() if n != 2}
              return {"histogram": {str(k):int(v) for k,v in sorted(hist.items())}, "abnormal_count":len(bad), "abnormal_sample":dict(list(bad.items())[:30])}

          rows=[]
          for linear in [0.00660,0.00664,0.006666666667,0.00668,0.006695,0.00672,0.00676]:
              tag=f"lin_{linear:.12f}".replace(".","p")
              out=root/tag
              out.mkdir(parents=True,exist_ok=True)
              stl=out/"top_direct_native.stl"
              mesher=BRepMesh_IncrementalMesh(model.wrapped,linear,False,0.60,True)
              mesher.Perform()
              if not mesher.IsDone(): raise RuntimeError(f"meshing failed {linear}")
              writer=StlAPI_Writer(); writer.ASCIIMode=False
              if not writer.Write(model.wrapped,str(stl)): raise RuntimeError(f"write failed {linear}")
              raw=as_mesh(trimesh.load_mesh(stl,process=True),f"direct {linear}")
              row={"linear_tolerance_mm":linear,"raw":mesh_stats(raw),"raw_edges":abnormal_edges(raw)}
              candidates=[]
              candidates.append(("raw",raw,{"method":"none"}))
              try:
                  split,split_audit,split_checks=topology_split_reference(raw)
                  candidates.append(("single_four_face_split",split,{"audit":split_audit,"checks":split_checks}))
              except Exception as exc:
                  row["single_four_face_split_exception"]=repr(exc)
              try:
                  zero,zero_audit=remove_zero_area_faces(raw,"direct")
                  candidates.append(("zero_area_removed",zero,{"audit":zero_audit}))
                  try:
                      split2,split2_audit,split2_checks=topology_split_reference(zero)
                      candidates.append(("zero_area_then_split",split2,{"audit":split2_audit,"checks":split2_checks}))
                  except Exception as exc:
                      row["zero_area_then_split_exception"]=repr(exc)
              except Exception as exc:
                  row["zero_area_exception"]=repr(exc)

              tested=[]
              for name,mesh,repair in candidates:
                  item={"name":name,"repair":repair,"stats":mesh_stats(mesh),"edges":abnormal_edges(mesh)}
                  if mesh.is_watertight and mesh.is_winding_consistent and mesh.is_volume:
                      try:
                          gmr,gmr_stats=directional(mesh,reference,f"{tag}_{name}_gmr")
                          rmg,rmg_stats=directional(reference,mesh,f"{tag}_{name}_rmg")
                          item.update({"generated_minus_reference_mm3":gmr,"reference_minus_generated_mm3":rmg,"symmetric_difference_mm3":gmr+rmg,"symmetric_difference_percent":(gmr+rmg)/abs(reference_raw.volume)*100.0,"gmr_stats":gmr_stats,"rmg_stats":rmg_stats})
                          mesh.export(out/f"top_direct_{name}.stl")
                      except Exception as exc:
                          item["boolean_exception"]=repr(exc)
                  tested.append(item)
              row["candidates"]=tested
              valid=[x for x in tested if "symmetric_difference_percent" in x]
              if valid: row["best"]=min(valid,key=lambda x:x["symmetric_difference_percent"])
              rows.append(row)
              print(json.dumps(row,indent=2),flush=True)

          valid_rows=[r for r in rows if "best" in r]
          valid_rows.sort(key=lambda r:r["best"]["symmetric_difference_percent"])
          report={"reference_audit":ref_audit,"reference_checks":ref_checks,"rows":rows,"best":valid_rows[0] if valid_rows else None}
          (root/"report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print("FINAL")
          print(json.dumps(report["best"],indent=2))
          PY
          cat generated/direct_final_solid/report.json

      - name: Upload direct final-solid audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-top-direct-final-solid-${{ github.run_id }}
          path: tmp_top_validation/generated/direct_final_solid/**
          if-no-files-found: warn
