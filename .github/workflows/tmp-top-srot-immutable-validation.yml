# Best absolute-deflection residual localization 2026-08-05T05:42+05:30
name: Immutable top absolute residual localization

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/tmp-top-srot-immutable-validation.yml]

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable lowercase-v source commit
        uses: actions/checkout@v4
        with:
          ref: cc3523043a98f97d5a7938e48cdbb947990f4a09

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tmp_top_validation/requirements.txt

      - name: Install checksum-verified Arial and pinned CAD stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fontconfig cabextract curl xz-utils
          FONT_TMP="$(mktemp -d)"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 -o "$FONT_TMP/arial32.exe" https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q -d "$FONT_TMP" "$FONT_TMP/arial32.exe"
          test "$(sha256sum "$FONT_TMP/Arial.TTF" | awk '{print $1}')" = "35c0f3559d8db569e36c31095b8a60d441643d95f59139de40e23fada819b833"
          install -Dm644 "$FONT_TMP/Arial.TTF" "$HOME/.local/share/fonts/Arial.ttf"
          fc-cache -f
          fc-match Arial | grep -qi Arial
          python -m pip install --upgrade pip
          python -m pip install -r tmp_top_validation/requirements.txt

      - name: Reassemble and verify immutable reference STL
        shell: bash
        run: |
          set -euxo pipefail
          REF_DIR=tmp_top_validation/reference
          cat "$REF_DIR"/top.stl.xz.b64.00 "$REF_DIR"/top.stl.xz.b64.01 "$REF_DIR"/top.stl.xz.b64.02 "$REF_DIR"/top.stl.xz.b64.03 "$REF_DIR"/top.stl.xz.b64.04 > "$REF_DIR"/top.stl.xz.b64
          test "$(sha256sum "$REF_DIR"/top.stl.xz.b64 | awk '{print $1}')" = "562abd14f9e3bfdfebac2fcb8c4d2fc8806c007f540f04b3a2aaa319f7a31924"
          base64 --decode "$REF_DIR"/top.stl.xz.b64 > "$REF_DIR"/top.stl.xz
          test "$(sha256sum "$REF_DIR"/top.stl.xz | awk '{print $1}')" = "e646f4a8013e6fe9c31ff379311719f74fb1e6b405fd273c66b6b504258312d0"
          xz --decompress --stdout "$REF_DIR"/top.stl.xz > "$REF_DIR"/top.stl
          test "$(sha256sum "$REF_DIR"/top.stl | awk '{print $1}')" = "d9cd3e5cae398287140e92136a87a7aa1ed6ec4433434fca0cf0b661ca869cac"

      - name: Install and compile final recovered feature tree plus localizer
        shell: bash
        run: |
          set -euxo pipefail
          python tmp_top_validation/apply_explicit_boolean_tree_fix.py
          python tmp_top_validation/apply_f005_boolean_tolerance_fix.py
          python tmp_top_validation/apply_f012_all_faces_fix.py
          python tmp_top_validation/apply_f012_font_size_fix.py
          python tmp_top_validation/apply_f012_lowercase_v_fix.py
          python -m py_compile \
            tmp_top_validation/top_parametric.py \
            tmp_top_validation/validate_fast_manifold.py \
            tmp_top_validation/validate_feature_tree_manifold.py \
            tmp_top_validation/diagnose_difference_components.py
          git diff --check

      - name: Localize best absolute-deflection residual
        shell: bash
        run: |
          set -euxo pipefail
          cd tmp_top_validation
          rm -rf generated/absolute_residual
          mkdir -p generated/absolute_residual
          python - <<'PY' 2>&1 | tee generated/absolute_residual/localization.log
          from pathlib import Path

          import trimesh
          from OCP.BRepMesh import BRepMesh_IncrementalMesh
          from OCP.StlAPI import StlAPI_Writer

          import validate_feature_tree_manifold as vf

          LINEAR = 0.006680000000
          ANGULAR = 0.60
          out = Path("generated/absolute_residual")
          features = out / "feature_meshes"

          def tessellate_shape(shape, name: str):
              features.mkdir(parents=True, exist_ok=True)
              path = features / f"{name}.stl"
              mesher = BRepMesh_IncrementalMesh(shape.wrapped, LINEAR, False, ANGULAR, True)
              mesher.Perform()
              if not mesher.IsDone():
                  raise RuntimeError(f"OCCT absolute meshing failed for {name}")
              writer = StlAPI_Writer()
              writer.ASCIIMode = False
              if not writer.Write(shape.wrapped, str(path)):
                  raise RuntimeError(f"OCCT STL write failed for {name}")
              return vf.as_mesh(trimesh.load_mesh(path, process=True), name)

          vf.GENERATED = out
          vf.FEATURES = features
          vf.tessellate_shape = tessellate_shape

          import diagnose_difference_components as dd
          dd.GENERATED = out
          dd.FEATURES = features
          dd.OUT = out / "difference_components"
          dd.OUT.mkdir(parents=True, exist_ok=True)
          dd.build_feature_mesh_tree = vf.build_feature_mesh_tree
          raise SystemExit(dd.main())
          PY
          cat generated/absolute_residual/difference_components/report.json

      - name: Upload absolute residual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-top-absolute-residual-${{ github.run_id }}
          path: tmp_top_validation/generated/absolute_residual/**
          if-no-files-found: warn
