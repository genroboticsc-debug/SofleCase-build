name: Immutable top outer-shell radius sweep

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmp-top-srot-immutable-validation.yml
      - tmp_top_validation/validate_direct_final_solid.py
      - tmp_top_validation/run_outer_radius_sweep.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out immutable recovered source commit
        uses: actions/checkout@v4
        with:
          ref: cc3523043a98f97d5a7938e48cdbb947990f4a09
          fetch-depth: 1

      - name: Inject frozen direct validator and radius sweep
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin tmp/top-engraving-frozen-validation-20260805
          git show FETCH_HEAD:tmp_top_validation/validate_direct_final_solid.py > tmp_top_validation/validate_direct_final_solid.py
          git show FETCH_HEAD:tmp_top_validation/run_outer_radius_sweep.py > tmp_top_validation/run_outer_radius_sweep.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tmp_top_validation/requirements.txt

      - name: Install checksum-verified Arial and pinned CAD stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fontconfig cabextract curl xz-utils
          FONT_TMP="$(mktemp -d)"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 -o "$FONT_TMP/arial32.exe" https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q -d "$FONT_TMP" "$FONT_TMP/arial32.exe"
          test "$(sha256sum "$FONT_TMP/Arial.TTF" | awk '{print $1}')" = "35c0f3559d8db569e36c31095b8a60d441643d95f59139de40e23fada819b833"
          install -Dm644 "$FONT_TMP/Arial.TTF" "$HOME/.local/share/fonts/Arial.ttf"
          fc-cache -f
          fc-match Arial | grep -qi Arial
          python -m pip install --upgrade pip
          python -m pip install -r tmp_top_validation/requirements.txt
          python -m pip install networkx==3.6.1

      - name: Reassemble and verify immutable reference STL
        shell: bash
        run: |
          set -euxo pipefail
          REF_DIR=tmp_top_validation/reference
          cat "$REF_DIR"/top.stl.xz.b64.00 "$REF_DIR"/top.stl.xz.b64.01 "$REF_DIR"/top.stl.xz.b64.02 "$REF_DIR"/top.stl.xz.b64.03 "$REF_DIR"/top.stl.xz.b64.04 > "$REF_DIR"/top.stl.xz.b64
          test "$(sha256sum "$REF_DIR"/top.stl.xz.b64 | awk '{print $1}')" = "562abd14f9e3bfdfebac2fcb8c4d2fc8806c007f540f04b3a2aaa319f7a31924"
          base64 --decode "$REF_DIR"/top.stl.xz.b64 > "$REF_DIR"/top.stl.xz
          test "$(sha256sum "$REF_DIR"/top.stl.xz | awk '{print $1}')" = "e646f4a8013e6fe9c31ff379311719f74fb1e6b405fd273c66b6b504258312d0"
          xz --decompress --stdout "$REF_DIR"/top.stl.xz > "$REF_DIR"/top.stl
          test "$(sha256sum "$REF_DIR"/top.stl | awk '{print $1}')" = "d9cd3e5cae398287140e92136a87a7aa1ed6ec4433434fca0cf0b661ca869cac"

      - name: Install recovered feature-tree migrations and run strict SROT
        shell: bash
        run: |
          set -euxo pipefail
          python tmp_top_validation/apply_explicit_boolean_tree_fix.py
          python tmp_top_validation/apply_f005_boolean_tolerance_fix.py
          python tmp_top_validation/apply_f012_all_faces_fix.py
          python tmp_top_validation/apply_f012_font_size_fix.py
          python tmp_top_validation/apply_f012_lowercase_v_fix.py
          python -m py_compile \
            tmp_top_validation/top_parametric.py \
            tmp_top_validation/strict_srot_check.py \
            tmp_top_validation/validate_fast_manifold.py \
            tmp_top_validation/validate_feature_tree_manifold.py \
            tmp_top_validation/validate_direct_final_solid.py \
            tmp_top_validation/run_outer_radius_sweep.py
          python tmp_top_validation/strict_srot_check.py
          git diff --check

      - name: Run outer radius Boolean sweep
        shell: bash
        run: |
          set -o pipefail
          rm -rf tmp_top_validation/generated/outer_radius_sweep
          python tmp_top_validation/run_outer_radius_sweep.py 2>&1 | tee tmp_top_validation/outer_radius_sweep.log

      - name: Upload outer-radius evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-top-outer-radius-sweep-${{ github.run_id }}
          path: |
            tmp_top_validation/generated/outer_radius_sweep/**
            tmp_top_validation/outer_radius_sweep.log
            tmp_top_validation/strict_srot_report.json
          if-no-files-found: warn
