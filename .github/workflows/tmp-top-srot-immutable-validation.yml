name: P014 top strict OpenCascade validation

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmp-top-srot-immutable-validation.yml
      - ci/P014_ci_payload.tar.xz.b64.part-*
      - ci/P014_patch_source.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Decode, verify, and patch isolated P014 payload
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/P014_ci_payload.tar.xz.b64.part-* > /tmp/P014_ci_payload.tar.xz.b64
          echo '8148177cad33b99dac2c4ee9abb36a52f1a165a50fc3cb238a5af3c6704d2e3b  /tmp/P014_ci_payload.tar.xz.b64' | sha256sum -c -
          base64 --decode /tmp/P014_ci_payload.tar.xz.b64 > /tmp/P014_ci_payload.tar.xz
          echo '90e7c8fcdc16cb8a266299aacdb44dfa0a43ee7421f8c7f3eecbf20596d572ee  /tmp/P014_ci_payload.tar.xz' | sha256sum -c -
          xz -t /tmp/P014_ci_payload.tar.xz
          rm -rf p014
          mkdir p014
          tar -xJf /tmp/P014_ci_payload.tar.xz -C p014
          python ci/P014_patch_source.py p014/scripts/dilemma_3x5_3_top.py

      - name: Install and preserve pinned CAD runtime
        working-directory: p014
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p runtime_wheels small_wheels
          python -m pip download --only-binary=:all: --no-deps \
            --dest runtime_wheels \
            cadquery-ocp==7.9.3.1.1 \
            cadquery-ocp-proxy==7.9.3.1.1 \
            vtk==9.6.2
          python -m pip download --only-binary=:all: --no-deps \
            --dest small_wheels svgelements==1.9.6
          sha256sum runtime_wheels/* > runtime_wheels/SHA256SUMS.txt
          sha256sum small_wheels/* > small_wheels/SHA256SUMS.txt
          cat runtime_wheels/SHA256SUMS.txt
          cat small_wheels/SHA256SUMS.txt
          python -m pip install --only-binary=:all: \
            build123d==0.11.1 \
            cadquery-ocp==7.9.3.1.1 \
            trimesh==4.11.1 \
            numpy==2.3.5
          python - <<'PY'
          import build123d, OCP, numpy, trimesh, vtk
          print('build123d', getattr(build123d, '__version__', 'unknown'))
          print('OCP', getattr(OCP, '__version__', 'unknown'))
          print('numpy', numpy.__version__)
          print('trimesh', trimesh.__version__)
          print('vtk', vtk.vtkVersion.GetVTKVersion())
          PY

      - name: Upload exact small Python dependency
        uses: actions/upload-artifact@v4
        with:
          name: P014-svgelements-wheel-${{ github.run_id }}
          path: p014/small_wheels
          if-no-files-found: error
          retention-days: 14

      - name: Run clean strict SROT and true Boolean validation
        working-directory: p014
        shell: bash
        run: |
          set +e
          set -o pipefail
          python validation/run_all.py --root . 2>&1 | tee reports/github_actions_run.log
          status=${PIPESTATUS[0]}
          echo "$status" > reports/github_actions_exit_code.txt
          exit 0

      - name: Upload generated geometry, reports, and exact OCC runtime wheels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P014-top-strict-validation-${{ github.run_id }}
          path: |
            p014/generated
            p014/reports
            p014/runtime_wheels
            p014/scripts/dilemma_3x5_3_top.py
            p014/reference/top.stl
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce validation exit code
        working-directory: p014
        shell: bash
        run: test "$(cat reports/github_actions_exit_code.txt)" = "0"
