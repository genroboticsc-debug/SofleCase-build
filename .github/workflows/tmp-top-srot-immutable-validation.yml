# Native OCCT absolute deflection sweep trigger 2026-08-05T05:22+05:30
name: Immutable top native absolute tessellation sweep

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/tmp-top-srot-immutable-validation.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable lowercase-v source commit
        uses: actions/checkout@v4
        with:
          ref: cc3523043a98f97d5a7938e48cdbb947990f4a09

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tmp_top_validation/requirements.txt

      - name: Install checksum-verified Arial and pinned CAD stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fontconfig cabextract curl xz-utils
          FONT_TMP="$(mktemp -d)"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 -o "$FONT_TMP/arial32.exe" https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q -d "$FONT_TMP" "$FONT_TMP/arial32.exe"
          test "$(sha256sum "$FONT_TMP/Arial.TTF" | awk '{print $1}')" = "35c0f3559d8db569e36c31095b8a60d441643d95f59139de40e23fada819b833"
          install -Dm644 "$FONT_TMP/Arial.TTF" "$HOME/.local/share/fonts/Arial.ttf"
          fc-cache -f
          fc-match Arial | grep -qi Arial
          python -m pip install --upgrade pip
          python -m pip install -r tmp_top_validation/requirements.txt

      - name: Install final recovered lowercase-v feature tree
        shell: bash
        run: |
          set -euxo pipefail
          python tmp_top_validation/apply_explicit_boolean_tree_fix.py
          python tmp_top_validation/apply_f005_boolean_tolerance_fix.py
          python tmp_top_validation/apply_f012_all_faces_fix.py
          python tmp_top_validation/apply_f012_font_size_fix.py
          python tmp_top_validation/apply_f012_lowercase_v_fix.py
          python -m py_compile tmp_top_validation/top_parametric.py
          git diff --check

      - name: Sweep native OCCT absolute deflection
        shell: bash
        run: |
          set -euxo pipefail
          cd tmp_top_validation
          rm -rf generated/tessellation_tolerance
          mkdir -p generated/tessellation_tolerance
          python - <<'PY' 2>&1 | tee generated/tessellation_tolerance/sweep.log
          from __future__ import annotations

          import json
          import math
          from pathlib import Path

          import numpy as np
          import trimesh
          from OCP.BRepMesh import BRepMesh_IncrementalMesh
          from OCP.StlAPI import StlAPI_Writer

          import top_parametric as tp

          out = Path("generated/tessellation_tolerance")
          linear_values = [0.00328, 0.00330, 0.00332, 0.0033296, 0.003333333333, 0.00334, 0.003345, 0.0033485, 0.00336]
          angular_values = [0.20, 0.30, 0.40, 0.60, 1.00]
          radii = {
              "mount_bore_r2p3": tp.MOUNT_BORE_RADIUS,
              "boss_r4p3": tp.BOSS_RADIUS,
              "through_r19p5": tp.THROUGH_RADIUS,
              "counterbore_r21p5": tp.COUNTERBORE_RADIUS,
          }
          expected = {
              "mount_bore_r2p3": 59,
              "boss_r4p3": 80,
              "through_r19p5": 170,
              "counterbore_r21p5": 179,
          }

          def export_absolute(shape, path: Path, linear: float, angular: float) -> None:
              mesher = BRepMesh_IncrementalMesh(shape.wrapped, linear, False, angular, True)
              mesher.Perform()
              if not mesher.IsDone():
                  raise RuntimeError(f"OCCT meshing failed for {path.name}")
              writer = StlAPI_Writer()
              writer.ASCIIMode = False
              if not writer.Write(shape.wrapped, str(path)):
                  raise RuntimeError(f"OCCT STL write failed for {path.name}")

          def ring_stats(path: Path, radius: float) -> dict[str, float | int]:
              mesh = trimesh.load_mesh(path, process=False)
              if isinstance(mesh, trimesh.Scene):
                  mesh = mesh.to_mesh()
              vertices = np.asarray(mesh.vertices, dtype=float)
              radial = np.hypot(vertices[:, 0], vertices[:, 2])
              mask = np.isclose(radial, radius, atol=2.0e-5)
              angles = np.mod(np.arctan2(vertices[mask, 2], vertices[mask, 0]), 2.0 * math.pi)
              rounded = np.unique(np.round(angles, 12))
              rounded.sort()
              wrapped = np.r_[rounded, rounded[0] + 2.0 * math.pi]
              steps_deg = np.degrees(np.diff(wrapped))
              median_step = float(np.median(steps_deg))
              return {
                  "ring_vertex_count": int(len(rounded)),
                  "median_step_deg": median_step,
                  "min_step_deg": float(np.min(steps_deg)),
                  "max_step_deg": float(np.max(steps_deg)),
                  "median_chord_sag_mm": float(radius * (1.0 - math.cos(math.radians(median_step) / 2.0))),
                  "face_count": int(len(mesh.faces)),
                  "vertex_count": int(len(mesh.vertices)),
              }

          rows = []
          for linear in linear_values:
              for angular in angular_values:
                  row = {"linear_tolerance_mm": linear, "angular_tolerance_rad": angular, "relative": False, "features": {}}
                  for label, radius in radii.items():
                      solid = tp._subtract_cylindrical_bore(0.0, 0.0, radius, 0.0, 1.0)
                      path = out / f"{label}__lin_{linear:.12g}__ang_{angular:.12g}.stl"
                      export_absolute(solid, path, linear, angular)
                      row["features"][label] = ring_stats(path, radius)
                      path.unlink()
                  row["target_score"] = sum(abs(row["features"][name]["ring_vertex_count"] - count) for name, count in expected.items())
                  rows.append(row)
                  print(json.dumps(row, sort_keys=True), flush=True)

          rows.sort(key=lambda item: (item["target_score"], abs(item["linear_tolerance_mm"] - 0.003333333333), item["angular_tolerance_rad"]))
          report = {
              "reference_targets": expected,
              "best": rows[:20],
              "all": rows,
          }
          (out / "report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("BEST")
          print(json.dumps(report["best"], indent=2))
          PY
          cat generated/tessellation_tolerance/report.json

      - name: Upload native absolute tolerance sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-top-native-absolute-sweep-${{ github.run_id }}
          path: tmp_top_validation/generated/tessellation_tolerance/**
          if-no-files-found: warn
