name: Dilemma Tenting Puck Exact Reverse Engineering

on:
  push:
    branches:
      - reverse-engineering/dilemma-tenting-puck
    paths:
      - "dilemma_tenting_puck/**"
      - ".github/workflows/dilemma_tenting_puck_reverse_engineering.yml"
  pull_request:
    branches:
      - master
    paths:
      - "dilemma_tenting_puck/**"
      - ".github/workflows/dilemma_tenting_puck_reverse_engineering.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-brep-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact CAD kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build123d==0.11.1" "cadquery-ocp==7.9.3.1.1"

      - name: Analyze STEP B-reps and true boolean delta
        run: |
          mkdir -p dilemma_tenting_puck/analysis_output
          python dilemma_tenting_puck/analyze_reference.py 2>&1 | tee dilemma_tenting_puck/analysis_output/run.log
          python dilemma_tenting_puck/render_reference.py

      - name: Upload exact geometry analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-tenting-puck-exact-analysis
          path: |
            dilemma_tenting_puck/analysis_output/**
          if-no-files-found: warn
          retention-days: 7
