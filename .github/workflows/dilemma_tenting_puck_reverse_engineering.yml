name: Dilemma Tenting Puck Exact Reverse Engineering

on:
  push:
    branches:
      - reverse-engineering/dilemma-tenting-puck
    paths:
      - "dilemma_tenting_puck/**"
      - ".github/workflows/dilemma_tenting_puck_reverse_engineering.yml"
  pull_request:
    branches:
      - master
    paths:
      - "dilemma_tenting_puck/**"
      - ".github/workflows/dilemma_tenting_puck_reverse_engineering.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-brep-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact CAD kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dilemma_tenting_puck/requirements.txt

      - name: Materialize auditable Build123d sources
        run: |
          python dilemma_tenting_puck/materialize_sources.py
          python dilemma_tenting_puck/apply_baseline_refinement.py
          python -m py_compile \
            dilemma_tenting_puck/dilemma_tenting_puck_family.py \
            dilemma_tenting_puck/validate_dilemma_tenting_puck.py

      - name: Analyze exact reference B-reps
        run: |
          mkdir -p dilemma_tenting_puck/analysis_output
          python dilemma_tenting_puck/analyze_reference.py 2>&1 | tee dilemma_tenting_puck/analysis_output/run.log

      - name: Build and validate genuine parametric feature trees
        id: validation
        shell: bash
        run: |
          set +e
          cd dilemma_tenting_puck
          mkdir -p validation_output
          python validate_dilemma_tenting_puck.py 2>&1 | tee validation_output/validation.log
          code=${PIPESTATUS[0]}
          echo "validator_exit_code=$code" | tee validation_output/validator_exit_code.txt
          exit 0

      - name: Upload exact reverse-engineering package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-tenting-puck-reconstruction
          path: |
            dilemma_tenting_puck/dilemma_tenting_puck_family.py
            dilemma_tenting_puck/validate_dilemma_tenting_puck.py
            dilemma_tenting_puck/analysis_output/**
            dilemma_tenting_puck/validation_output/**
          if-no-files-found: error
          retention-days: 7
