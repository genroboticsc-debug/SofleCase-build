name: SROT Pico WRL analysis
on:
  pull_request:
    paths:
      - 'srot_pico_wrl_marker.txt'
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y assimp-utils
      - name: Fetch pinned Pico WRL
        run: |
          curl -L --fail -o Pico.wrl 'https://raw.githubusercontent.com/gusmanb/logicanalyzer/4e8d9ec9fff592f7bb84490d8e301061a36e7f22/Electronics/LogicAnalyzer/LogicAnalyzer/Pico.wrl'
          sha256sum Pico.wrl > SHA256.txt
      - name: Inspect and attempt conversions
        shell: bash
        run: |
          set +e
          assimp info Pico.wrl > assimp_info.txt 2>&1
          echo $? > assimp_info.rc
          assimp export Pico.wrl Pico.glb -f glb2 > assimp_export_glb.txt 2>&1
          echo $? > assimp_export_glb.rc
          assimp export Pico.wrl Pico.obj -f objnomtl > assimp_export_obj.txt 2>&1
          echo $? > assimp_export_obj.rc
          assimp export Pico.wrl Pico.dae -f collada > assimp_export_dae.txt 2>&1
          echo $? > assimp_export_dae.rc
          assimp export Pico.wrl Pico.ply -f ply > assimp_export_ply.txt 2>&1
          echo $? > assimp_export_ply.rc
          ls -lah > directory_listing.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srot-pico-wrl-analysis
          path: |
            Pico.wrl
            Pico.glb
            Pico.obj
            Pico.dae
            Pico.ply
            assimp_*.txt
            assimp_*.rc
            SHA256.txt
            directory_listing.txt
          if-no-files-found: warn
          retention-days: 1
