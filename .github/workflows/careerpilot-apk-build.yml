name: CareerPilot 3.1 Auth Build

on:
  push:
    branches:
      - careerpilot-auth-rebuild-20260805
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated auth rebuild branch
        uses: actions/checkout@v4
        with:
          ref: careerpilot-auth-rebuild-20260805

      - name: Restore base source and apply verified auth patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf careerpilot /tmp/careerpilot-source.* /tmp/careerpilot-auth-patch.*
          cat .careerpilot-build/source.xz.b64.part* > /tmp/careerpilot-source.b64
          base64 --decode /tmp/careerpilot-source.b64 > /tmp/careerpilot-source.tar.xz
          echo "2f07e23c03398e68f05513b7708bb67149c7d67f5063cf0328bf3b0c01d7dfc4  /tmp/careerpilot-source.tar.xz" | sha256sum --check
          mkdir -p careerpilot
          tar -xJf /tmp/careerpilot-source.tar.xz -C careerpilot

          base64 --decode .careerpilot-auth-patch/patch.tar.xz.b64 > /tmp/careerpilot-auth-patch.tar.xz
          echo "d122666f23da372201642943e18a49d55e1f6267fa83cd02486792b3f67ebdfe  /tmp/careerpilot-auth-patch.tar.xz" | sha256sum --check
          tar -xJf /tmp/careerpilot-auth-patch.tar.xz -C careerpilot

          test -f careerpilot/app/google-services.json
          grep -q 'version "2.3.20"' careerpilot/build.gradle.kts
          grep -q 'versionName = "3.1.0"' careerpilot/app/build.gradle.kts
          grep -q 'startPhoneVerification' careerpilot/app/src/main/java/com/careerpilot/ai/auth/AuthManager.kt
          grep -q 'SEND VERIFICATION CODE' careerpilot/app/src/main/java/com/careerpilot/ai/ui/auth/LoginScreen.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile CareerPilot 3.1
        working-directory: careerpilot
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp careerpilot/app/build/outputs/apk/debug/app-debug.apk artifact/CareerPilotAI-Pro-3.1.0-auth-rebuild-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifact/CareerPilotAI-Pro-3.1.0-auth-rebuild-debug.apk > artifact/signature-report.txt
          sha256sum artifact/CareerPilotAI-Pro-3.1.0-auth-rebuild-debug.apk > artifact/CareerPilotAI-Pro-3.1.0-auth-rebuild-debug.apk.sha256
          unzip -t artifact/CareerPilotAI-Pro-3.1.0-auth-rebuild-debug.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-3.1.0-auth-rebuild-debug
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
