name: SROT full Python 3.13 wheelhouse
on:
  pull_request:
    paths:
      - 'srot_full_wheelhouse_marker.txt'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download complete wheelhouse
        run: |
          python -m pip install --upgrade pip
          mkdir wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse \
            build123d==0.11.1 manifold3d==3.5.2 trimesh==4.11.1
          ls -lh wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: srot-full-python313-wheelhouse
          path: wheelhouse/*.whl
          retention-days: 1
