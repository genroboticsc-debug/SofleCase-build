name: Mouse RightButtons Authority Analysis

on:
  pull_request:
    branches: [master]
    paths:
      - 'mouse_runtime/analyze_rightbuttons_step.py'
      - 'mouse_runtime/analyze_rightbuttons_offset.py'
      - '.github/workflows/mouse-rightbuttons-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact analysis kernel
        run: python -m pip install 'cadquery-ocp-novtk==7.9.3.1.1'
      - name: Fetch authoritative Mouse STEP
        shell: bash
        run: |
          mkdir -p reference
          curl --fail --location --retry 5 --output reference/Mouse.STEP \
            'https://raw.githubusercontent.com/ploopyco/mouse/41e3eb18e59627b181d67c270b22244a505f1315/hardware/mechanicals/Mouse.STEP'
          echo 'fcd48ca5636fab4cb3f0ed3c69e3f7dbe00cca3c27cbb77c41fdd25bed5238cb  reference/Mouse.STEP' | sha256sum -c -
      - name: Analyze exact RightButtons face adjacency
        run: python mouse_runtime/analyze_rightbuttons_step.py
      - name: Analyze correct occurrence R1.6 rail/offset relationships
        run: python mouse_runtime/analyze_rightbuttons_offset.py
      - name: Upload authority analysis
        uses: actions/upload-artifact@v4
        with:
          name: rightbuttons-authority-analysis
          path: |
            mouse_runtime/rightbuttons_authority_analysis.json
            mouse_runtime/rightbuttons_offset_analysis.json
