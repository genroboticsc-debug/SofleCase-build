name: Nexus Voice v0.3 APK Build

on:
  push:
    branches:
      - nexus-voice-v030-build-20260818

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat .nexus-v030/chunk00.b64 .nexus-v030/chunk01.b64 .nexus-v030/chunk02.b64 | base64 -d > /tmp/NemotronVoice_v030.tar.xz
          mkdir -p /tmp/nexus
          tar -xJf /tmp/NemotronVoice_v030.tar.xz -C /tmp/nexus
          test -f /tmp/nexus/NemotronVoice_v030/app/build.gradle
          test -f /tmp/nexus/NemotronVoice_v030/app/src/main/java/com/nexus/nemotronvoice/agent/AgentBrain.java
          test -f /tmp/nexus/NemotronVoice_v030/app/src/main/java/com/nexus/nemotronvoice/memory/MemoryStore.java
          test -f /tmp/nexus/NemotronVoice_v030/app/src/main/java/com/nexus/nemotronvoice/automation/AssistantAccessibilityService.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: /tmp/nexus/NemotronVoice_v030
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/nexus/NemotronVoice_v030/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/nexus-v030-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/nexus-v030-signature.txt
          sha256sum "$APK" | tee /tmp/NexusVoice-v0.3.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: NexusVoice-v0.3.0-apk
          path: |
            /tmp/nexus/NemotronVoice_v030/app/build/outputs/apk/debug/app-debug.apk
            /tmp/NexusVoice-v0.3.0.apk.sha256
            /tmp/nexus-v030-badging.txt
            /tmp/nexus-v030-signature.txt
          if-no-files-found: error
          retention-days: 7
