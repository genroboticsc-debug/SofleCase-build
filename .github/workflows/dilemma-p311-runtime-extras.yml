name: Dilemma P311 runtime extras

on:
  pull_request:
    branches: [master]
    paths:
      - .github/dilemma-runtime-extras-trigger.txt

permissions:
  contents: read

jobs:
  fetch-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact P311 runtime extras
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --no-deps --dest wheelhouse \
            ezdxf==1.4.4 \
            fonttools==4.63.0 \
            ipython==9.16.0 \
            ocp-gordon==0.2.2 \
            pyparsing==3.3.2 \
            scikit-learn==1.9.0 \
            scipy==1.18.0 \
            svgelements==1.9.6 \
            svgpathtools==1.7.2 \
            trimesh==4.11.1 \
            typing-extensions==4.16.0 \
            webcolors==25.10.0
          cd wheelhouse
          sha256sum *.whl | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload exact P311 runtime extras
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-p311-runtime-extras-cp313
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 1
