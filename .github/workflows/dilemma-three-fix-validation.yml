name: Dilemma P019 P025 P029 exact validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-three:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install pinned CAD and validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1 manifold3d==3.5.2 trimesh==4.8.3 networkx==3.5

      - name: Decode exact scripts and validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scripts work/validation work/inventory work/XYZ/generated work/XYZ/reference
          base64 -d dilemma-three-fix/p019.py.xz.b64 | xz -d > work/scripts/dilemma_3x5_3_hotswap_mid.py
          cat dilemma-three-fix/p025.part-* | base64 -d | xz -d > work/scripts/dilemma_4x6_4_top.py
          base64 -d dilemma-three-fix/p029.py.xz.b64 | xz -d > work/scripts/dilemma_4x6_4_hotswap_mid.py
          base64 -d dilemma-three-fix/targeted_driver.py.xz.b64 | xz -d > work/targeted_driver.py
          base64 -d dilemma-three-fix/final_validator.py.xz.b64 | xz -d > work/validation/Final_validation_check.py
          python -m py_compile work/scripts/*.py work/targeted_driver.py work/validation/Final_validation_check.py

      - name: Fetch pinned exact upstream references
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Bastardkb/Dilemma.git upstream
          git -C upstream checkout f5cffb4821fe560b095418b71382ac7d8043c61a -- \
            mechanical/cases/3x5_3_hotswap/mid.stl \
            mechanical/cases/4x6_4/top.stl \
            mechanical/cases/4x6_4_hotswap/mid.stl
          cp upstream/mechanical/cases/3x5_3_hotswap/mid.stl work/XYZ/reference/dilemma_3x5_3_hotswap_mid.stl
          cp upstream/mechanical/cases/4x6_4/top.stl work/XYZ/reference/dilemma_4x6_4_top.stl
          cp upstream/mechanical/cases/4x6_4_hotswap/mid.stl work/XYZ/reference/dilemma_4x6_4_hotswap_mid.stl
          sha256sum work/XYZ/reference/*.stl
          test "$(sha256sum work/XYZ/reference/dilemma_3x5_3_hotswap_mid.stl | cut -d' ' -f1)" = "2acf8babae79ea185233231353c4bbcfa924c25411d46ac909c596fa89886070"
          test "$(sha256sum work/XYZ/reference/dilemma_4x6_4_top.stl | cut -d' ' -f1)" = "0c273a18158a01a4e4eaf0a86263d7e6ef61716afa1fddbf06759c5bbf9af718"
          test "$(sha256sum work/XYZ/reference/dilemma_4x6_4_hotswap_mid.stl | cut -d' ' -f1)" = "064bc85b03efc1981160cc7861fc146a87c8045302901a9c618e88eb19d6d349"

      - name: Write targeted exact inventory
        shell: bash
        run: |
          cat > work/inventory/expected_generated_inventory.json <<'JSON'
          [
            {"canonical_part_id":"P019","part_name":"dilemma_3x5_3_hotswap_mid","production_script":"scripts/dilemma_3x5_3_hotswap_mid.py","validation_filename":"dilemma_3x5_3_hotswap_mid.stl","expected_body_count":1},
            {"canonical_part_id":"P025","part_name":"dilemma_4x6_4_top","production_script":"scripts/dilemma_4x6_4_top.py","validation_filename":"dilemma_4x6_4_top.stl","expected_body_count":1},
            {"canonical_part_id":"P029","part_name":"dilemma_4x6_4_hotswap_mid","production_script":"scripts/dilemma_4x6_4_hotswap_mid.py","validation_filename":"dilemma_4x6_4_hotswap_mid.stl","expected_body_count":1}
          ]
          JSON

      - name: Build exact targeted candidates
        working-directory: work
        continue-on-error: true
        run: |
          python targeted_driver.py 2>&1 | tee validation/targeted_build.log

      - name: Run strict bidirectional validator
        working-directory: work
        continue-on-error: true
        run: |
          python validation/Final_validation_check.py --only P019 P025 P029 2>&1 | tee validation/strict_targeted.log
          cat validation/validationoutput.txt || true
          cat validation/targeted_build_diagnostics.json || true

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp -r work/scripts evidence/
          cp -r work/XYZ evidence/
          cp -r work/validation evidence/
          cp work/targeted_driver.py evidence/
          tar -czf dilemma-three-fix-evidence.tar.gz evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dilemma-three-fix-evidence
          path: dilemma-three-fix-evidence.tar.gz
          if-no-files-found: error
