name: Dilemma fast exact topology batch

on:
  pull_request:
    branches: [master]
    paths:
      - dilemma-fast/**
      - .github/workflows/dilemma-fast.yml

permissions:
  contents: read

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CAD and Boolean runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1 manifold3d==3.5.2 trimesh==4.8.3 networkx==3.5
      - name: Recover supplied project and exact edited scripts
        run: |
          cat dilemma-runner/project.tar.xz.b64.part-* | base64 --decode > dilemma-runner/project.tar.xz
          tar -xJf dilemma-runner/project.tar.xz -C dilemma-runner
          for payload in dilemma-fast/scripts/*.py.xz.b64; do
            name="$(basename "$payload" .xz.b64)"
            base64 --decode "$payload" | xz --decompress > "dilemma-runner/project/scripts/$name"
          done
          python -m py_compile dilemma-runner/project/scripts/dilemma_3x5_3_top.py \
            dilemma-runner/project/scripts/dilemma_3x5_3_hotswap_bottom.py \
            dilemma-runner/project/scripts/dilemma_3x5_3_hotswap_mid.py \
            dilemma-runner/project/scripts/dilemma_3x5_3_hotswap_plate_left.py \
            dilemma-runner/project/scripts/dilemma_3x5_3_hotswap_plate_right.py
      - name: Fresh-build corrected parts
        env:
          OCP_SHOW: '0'
          PYTHONUNBUFFERED: '1'
        working-directory: dilemma-runner/project
        run: |
          set +e
          mkdir -p validation/fast_build_logs generated XYZ/generated
          rm -f \
            generated/dilemma_3x5_3_top.{step,stl} XYZ/generated/dilemma_3x5_3_top.stl \
            generated/dilemma_3x5_3_hotswap_bottom.{step,stl} XYZ/generated/dilemma_3x5_3_hotswap_bottom.stl \
            generated/dilemma_3x5_3_hotswap_mid.{step,stl} XYZ/generated/dilemma_3x5_3_hotswap_mid.stl \
            generated/dilemma_3x5_3_hotswap_plate_left.{step,stl} XYZ/generated/dilemma_3x5_3_hotswap_plate_left.stl \
            generated/dilemma_3x5_3_hotswap_plate_right.{step,stl} XYZ/generated/dilemma_3x5_3_hotswap_plate_right.stl
          status=0
          for stem in \
            dilemma_3x5_3_top \
            dilemma_3x5_3_hotswap_bottom \
            dilemma_3x5_3_hotswap_mid \
            dilemma_3x5_3_hotswap_plate_left \
            dilemma_3x5_3_hotswap_plate_right; do
            echo "BUILD $stem"
            timeout 900 python "scripts/$stem.py" --output-dir generated > "validation/fast_build_logs/$stem.log" 2>&1
            rc=$?
            echo "returncode=$rc" >> "validation/fast_build_logs/$stem.log"
            if [ "$rc" -eq 0 ] && [ -f "generated/$stem.step" ] && [ -f "generated/$stem.stl" ]; then
              cp "generated/$stem.stl" "XYZ/generated/$stem.stl"
              echo "$stem BUILD_OK"
            else
              echo "$stem BUILD_FAIL rc=$rc"
              status=1
            fi
          done
          echo "$status" > validation/fast_build_status.txt
          exit 0
      - name: Run supplied true two-way validator
        working-directory: dilemma-runner/project
        run: |
          python validation/Final_validation_check.py --only P014 P018 P019 P021 P022 || true
      - name: Write exact pass summary
        working-directory: dilemma-runner/project
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('validation/validation_report.json')
          report=json.loads(path.read_text()) if path.exists() else {'rows':[]}
          rows=report.get('rows',[])
          summary={
            'validated':len(rows),
            'official_pass_count':sum(bool(r.get('Overall_PASS')) for r in rows),
            'below_0_01_percent_count':sum(bool(r.get('Exact_0.01pct_Aspiration_PASS')) for r in rows),
            'watertight_count':sum(bool(r.get('Generated_STL_Watertight_PASS')) for r in rows),
            'boolean_success_count':sum(bool(r.get('Boolean_Success')) for r in rows),
            'parts':[{k:r.get(k) for k in ['Canonical_Part_ID','Overall_PASS','Boolean_Success','Generated_STL_Watertight_PASS','Symmetric_Difference_%','Volume_Error_%','Area_Error_%','BBox_X_Diff_mm','BBox_Y_Diff_mm','BBox_Z_Diff_mm','COM_Shift_mm','Failure_Reason']} for r in rows],
          }
          Path('validation/fast_exact_summary.json').write_text(json.dumps(summary,indent=2,allow_nan=False)+'\n')
          print(json.dumps(summary,indent=2,allow_nan=False))
          PY
      - name: Upload fresh CAD and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-fast-exact-topology
          path: |
            dilemma-runner/project/generated/dilemma_3x5_3_top.*
            dilemma-runner/project/generated/dilemma_3x5_3_hotswap_bottom.*
            dilemma-runner/project/generated/dilemma_3x5_3_hotswap_mid.*
            dilemma-runner/project/generated/dilemma_3x5_3_hotswap_plate_left.*
            dilemma-runner/project/generated/dilemma_3x5_3_hotswap_plate_right.*
            dilemma-runner/project/validation/fast_build_logs/
            dilemma-runner/project/validation/fast_build_status.txt
            dilemma-runner/project/validation/validation_report.json
            dilemma-runner/project/validation/validation_report.csv
            dilemma-runner/project/validation/validationoutput.txt
            dilemma-runner/project/validation/fast_exact_summary.json
          if-no-files-found: warn
          retention-days: 3
