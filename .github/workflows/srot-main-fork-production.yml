name: SROT main-fork production pass
on:
  pull_request:
    paths:
      - 'srot_main_fork_production_marker.txt'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft 365 font resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force odt | Out-Null
          Invoke-WebRequest -Uri 'https://officecdn.microsoft.com/pr/wsus/setup.exe' -OutFile 'odt/setup.exe'
          @'
          <Configuration>
            <Add OfficeClientEdition="64" Channel="Current">
              <Product ID="O365ProPlusRetail">
                <Language ID="en-us" />
                <ExcludeApp ID="Access" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Groove" />
                <ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" />
                <ExcludeApp ID="Outlook" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" />
                <ExcludeApp ID="Word" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
            <Property Name="AUTOACTIVATE" Value="0" />
            <Property Name="FORCEAPPSHUTDOWN" Value="TRUE" />
          </Configuration>
          '@ | Set-Content -Encoding utf8 odt/config.xml
          Start-Process -FilePath "$PWD/odt/setup.exe" -ArgumentList '/configure', "$PWD/odt/config.xml" -Wait -NoNewWindow
          if (-not (Test-Path 'C:\Windows\Fonts\GOTHICB.TTF')) { throw 'Century Gothic Bold was not installed' }
      - name: Install pinned CAD runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1 cadquery-ocp-novtk==7.9.3.1.1 trimesh==4.11.1 manifold3d==3.5.2
      - name: Build standalone production outputs
        shell: pwsh
        run: |
          python srot_main_fork_production.py
      - name: Fetch exact reference and validate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/gusmanb/logicanalyzer/4e8d9ec9fff592f7bb84490d8e301061a36e7f22/Enclosure/LogicAnalyzer_JasonYANG170/AnalyzerBoxMain_fork.STL' -OutFile 'AnalyzerBoxMain_fork.STL'
          @'
          import hashlib, json
          from pathlib import Path
          import trimesh
          ref=trimesh.load_mesh('AnalyzerBoxMain_fork.STL',process=True)
          gen=trimesh.load_mesh('generated_main_fork/enclosure_analyzerbox_main_fork.stl',process=True)
          miss=trimesh.boolean.difference([ref,gen],engine='manifold',check_volume=False)
          extra=trimesh.boolean.difference([gen,ref],engine='manifold',check_volume=False)
          mv=abs(miss.volume) if miss is not None else 0.0
          ev=abs(extra.volume) if extra is not None else 0.0
          pct=(mv+ev)/abs(ref.volume)*100.0
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          result={
            'part':'enclosure_analyzerbox_main_fork','status':'PASS' if pct<0.01 else 'FAIL',
            'method':'fresh bidirectional Manifold Boolean; exact Century Gothic Bold; feature-aware current-run tessellation',
            'reference_volume_mm3':abs(ref.volume),'generated_volume_mm3':abs(gen.volume),
            'reference_area_mm2':ref.area,'generated_area_mm2':gen.area,
            'missing_mm3':mv,'extra_mm3':ev,'symmetric_difference_percent':pct,
            'reference_watertight':bool(ref.is_watertight),'generated_watertight':bool(gen.is_watertight),
            'reference_faces':len(ref.faces),'generated_faces':len(gen.faces),
            'script_sha256':sha('srot_main_fork_production.py'),
            'step_sha256':sha('generated_main_fork/enclosure_analyzerbox_main_fork.step'),
            'stl_sha256':sha('generated_main_fork/enclosure_analyzerbox_main_fork.stl'),
            'font_dependency':'Century Gothic Bold external system font; no font file bundled'
          }
          Path('generated_main_fork/enclosure_analyzerbox_main_fork_validation.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          if pct>=0.01: raise SystemExit(1)
          '@ | Set-Content -Encoding utf8 validate_main_fork.py
          python validate_main_fork.py
      - uses: actions/upload-artifact@v4
        with:
          name: srot-main-fork-production-pass
          path: |
            srot_main_fork_production.py
            generated_main_fork/enclosure_analyzerbox_main_fork.step
            generated_main_fork/enclosure_analyzerbox_main_fork.stl
            generated_main_fork/enclosure_analyzerbox_main_fork_validation.json
          retention-days: 1
