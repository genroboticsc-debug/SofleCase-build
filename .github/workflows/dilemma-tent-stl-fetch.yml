name: Dilemma pinned tent STL fetch

on:
  pull_request:
    branches: [master]
    paths:
      - .github/dilemma-tent-stl-trigger.txt

permissions:
  contents: read

jobs:
  fetch-tents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned upstream tent files
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/Bastardkb/Dilemma.git upstream
          cd upstream
          git checkout f5cffb4821fe560b095418b71382ac7d8043c61a
          test "$(git rev-parse 'HEAD:mechanical/community mods/4x6_4 tents/tent-5.stl')" = 965bfcefb400d5c4b1d6cc9b851acf1634668547
          test "$(git rev-parse 'HEAD:mechanical/community mods/4x6_4 tents/tent-7.stl')" = ae62e1c51c1c7589aa9da9bce8755b7f97de273b
          test "$(git rev-parse 'HEAD:mechanical/community mods/4x6_4 tents/tent-15.stl')" = d7bc405c10e39f585ec9e2e79a13b7bd3d62f5b1
          mkdir -p ../artifact
          cp 'mechanical/community mods/4x6_4 tents/tent-5.stl' ../artifact/
          cp 'mechanical/community mods/4x6_4 tents/tent-7.stl' ../artifact/
          cp 'mechanical/community mods/4x6_4 tents/tent-15.stl' ../artifact/
          cd ../artifact
          sha256sum *.stl > SHA256SUMS.txt
      - name: Upload pinned canonical tent STLs
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-pinned-tent-stls
          path: artifact/
          if-no-files-found: error
          retention-days: 1
