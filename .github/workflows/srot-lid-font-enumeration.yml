name: SROT lid Windows font enumeration
on:
  pull_request:
    paths:
      - 'srot_lid_font_enumeration_marker.txt'
permissions:
  contents: read
jobs:
  generate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft 365 font resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force odt | Out-Null
          Invoke-WebRequest -Uri 'https://officecdn.microsoft.com/pr/wsus/setup.exe' -OutFile 'odt/setup.exe'
          @'
          <Configuration><Add OfficeClientEdition="64" Channel="Current"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Access" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Groove" /><ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="Word" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Property Name="AUTOACTIVATE" Value="0" /><Property Name="FORCEAPPSHUTDOWN" Value="TRUE" /></Configuration>
          '@ | Set-Content -Encoding utf8 odt/config.xml
          Start-Process -FilePath "$PWD/odt/setup.exe" -ArgumentList '/configure', "$PWD/odt/config.xml" -Wait -NoNewWindow
      - name: Install pinned CAD runtime
        shell: pwsh
        run: python -m pip install build123d==0.11.1
      - name: Export normalized text solids for every installed Windows font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lid_font_geometry | Out-Null
          @'
          from pathlib import Path
          import csv, re
          from build123d import Align, Axis, FontStyle, Location, Matrix, Text, export_stl, extrude
          out=Path('lid_font_geometry')
          x0,x1=10.204837799072266,54.57022476196289
          z0,z1=13.055909156799316,18.99821662902832
          tw,th=x1-x0,z1-z0
          rows=[]
          fonts=[]
          for p in Path(r'C:\Windows\Fonts').iterdir():
              if p.suffix.lower() in {'.ttf','.otf'}: fonts.append(p)
          for idx,p in enumerate(sorted(fonts,key=lambda q:q.name.lower())):
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',p.stem)[:80]
              name=f'{idx:04d}_{safe}.stl'
              try:
                  s=Text('Logic Analyzer',10.0,font_path=str(p),font_style=FontStyle.REGULAR,align=(Align.MIN,Align.MIN))
                  bb=s.bounding_box()
                  if bb.size.X<=0 or bb.size.Y<=0: raise ValueError('empty text')
                  s=s.transform_geometry(Matrix([[tw/bb.size.X,0,0,0],[0,th/bb.size.Y,0,0],[0,0,1,0]]))
                  solid=extrude(s,1.0).rotate(Axis.X,-90)
                  bb=solid.bounding_box();solid=solid.moved(Location((x0-bb.min.X,14.0-bb.min.Y,z0-bb.min.Z)))
                  export_stl(solid,out/name,tolerance=0.01,angular_tolerance=0.12)
                  rows.append([name,p.name,str(p),f'{solid.volume:.12f}','OK'])
              except Exception as e:
                  rows.append([name,p.name,str(p),'',f'ERROR:{type(e).__name__}:{e}'])
          with (out/'inventory.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f);w.writerow(['geometry_file','font_file','font_path','volume','status']);w.writerows(rows)
          print('fonts',len(fonts),'ok',sum(r[-1]=='OK' for r in rows),'errors',sum(r[-1]!='OK' for r in rows))
          '@ | Set-Content -Encoding utf8 enumerate_fonts.py
          python enumerate_fonts.py
      - uses: actions/upload-artifact@v4
        with:
          name: srot-lid-windows-font-geometry
          path: lid_font_geometry
          retention-days: 1
