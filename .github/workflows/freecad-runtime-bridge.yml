name: Temporary FreeCAD runtime bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch-freecad:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify official FreeCAD 1.1.3 AppImage
        shell: bash
        run: |
          set -euo pipefail
          FILE='FreeCAD_1.1.3-Linux-x86_64-py311.AppImage'
          URL='https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage'
          EXPECTED='3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef'
          curl -L --fail --retry 5 --retry-delay 2 -o "$FILE" "$URL"
          echo "$EXPECTED  $FILE" | sha256sum -c -
          chmod +x "$FILE"
          sha256sum "$FILE" > FREECAD_1.1.3_SHA256.txt
      - name: Upload verified FreeCAD AppImage
        uses: actions/upload-artifact@v4
        with:
          name: freecad-1.1.3-linux-x86_64-py311
          path: |
            FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
            FREECAD_1.1.3_SHA256.txt
          compression-level: 0
          retention-days: 1
