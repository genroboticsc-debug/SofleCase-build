name: Temporary OCCT 8 pinned BREP-to-STEP helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-pinned-export-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch and build official OCCT 8.0.0
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++ git
          git init occt
          git -C occt remote add origin https://github.com/Open-Cascade-SAS/OCCT.git
          git -C occt fetch --depth 1 origin refs/tags/V8_0_0:refs/tags/V8_0_0
          git -C occt checkout --detach refs/tags/V8_0_0
          test "$(git -C occt describe --tags --exact-match)" = "V8_0_0"
          cmake -S occt -B occt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-install" \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DUSE_FREETYPE=OFF -DUSE_TCL=OFF -DUSE_TK=OFF
          cmake --build occt-build --parallel 4
          cmake --install occt-build

      - name: Build deterministic BREP-to-STEP CLI
        shell: bash
        run: |
          set -euxo pipefail
          cat > occt8_brep_to_step.cpp <<'CPP'
          #include <BRep_Builder.hxx>
          #include <BRepTools.hxx>
          #include <BRepCheck_Analyzer.hxx>
          #include <BRepGProp.hxx>
          #include <GProp_GProps.hxx>
          #include <IFSelect_ReturnStatus.hxx>
          #include <Message_ProgressRange.hxx>
          #include <STEPControl_Reader.hxx>
          #include <STEPControl_Writer.hxx>
          #include <TopAbs_ShapeEnum.hxx>
          #include <TopExp_Explorer.hxx>
          #include <TopoDS_Shape.hxx>
          #include <cmath>
          #include <fstream>
          #include <iomanip>
          #include <iostream>
          #include <string>

          static int count(const TopoDS_Shape& shape, TopAbs_ShapeEnum kind) {
            int n = 0;
            for (TopExp_Explorer ex(shape, kind); ex.More(); ex.Next()) ++n;
            return n;
          }

          static void properties(const TopoDS_Shape& shape, double& volume, double& area) {
            GProp_GProps vp, ap;
            BRepGProp::VolumeProperties(shape, vp);
            BRepGProp::SurfaceProperties(shape, ap);
            volume = vp.Mass();
            area = ap.Mass();
          }

          int main(int argc, char** argv) {
            if (argc != 4) {
              std::cerr << "usage: occt8_brep_to_step input.brep output.step report.json\n";
              return 2;
            }
            const std::string input = argv[1];
            const std::string output = argv[2];
            const std::string report = argv[3];

            BRep_Builder builder;
            TopoDS_Shape source;
            std::ifstream in(input, std::ios::in);
            if (!in) return 10;
            BRepTools::Read(source, in, builder, Message_ProgressRange());
            if (source.IsNull()) return 10;

            const bool sourceValid = BRepCheck_Analyzer(source).IsValid();
            double sourceVolume = 0.0, sourceArea = 0.0;
            properties(source, sourceVolume, sourceArea);

            STEPControl_Writer writer;
            const auto transferStatus = writer.Transfer(source, STEPControl_ManifoldSolidBrep);
            const auto writeStatus = writer.Write(output.c_str());
            if (writeStatus != IFSelect_RetDone) return 11;

            STEPControl_Reader reader;
            if (reader.ReadFile(output.c_str()) != IFSelect_RetDone) return 12;
            reader.TransferRoots();
            TopoDS_Shape roundtrip = reader.OneShape();
            if (roundtrip.IsNull()) return 13;

            const bool roundtripValid = BRepCheck_Analyzer(roundtrip).IsValid();
            double roundtripVolume = 0.0, roundtripArea = 0.0;
            properties(roundtrip, roundtripVolume, roundtripArea);

            const int sourceSolids = count(source, TopAbs_SOLID);
            const int sourceShells = count(source, TopAbs_SHELL);
            const int sourceFaces = count(source, TopAbs_FACE);
            const int roundtripSolids = count(roundtrip, TopAbs_SOLID);
            const int roundtripShells = count(roundtrip, TopAbs_SHELL);
            const int roundtripFaces = count(roundtrip, TopAbs_FACE);
            const bool topologyPass = sourceValid && roundtripValid
              && sourceSolids == 1 && sourceShells == 1
              && roundtripSolids == 1 && roundtripShells == 1
              && sourceFaces == roundtripFaces;

            std::ofstream out(report);
            out << std::setprecision(17)
                << "{\n"
                << "  \"occt_tag\": \"V8_0_0\",\n"
                << "  \"source_valid\": " << (sourceValid ? "true" : "false") << ",\n"
                << "  \"source_solids\": " << sourceSolids << ",\n"
                << "  \"source_shells\": " << sourceShells << ",\n"
                << "  \"source_faces\": " << sourceFaces << ",\n"
                << "  \"source_volume\": " << sourceVolume << ",\n"
                << "  \"source_area\": " << sourceArea << ",\n"
                << "  \"transfer_status\": " << static_cast<int>(transferStatus) << ",\n"
                << "  \"write_status\": " << static_cast<int>(writeStatus) << ",\n"
                << "  \"roundtrip_valid\": " << (roundtripValid ? "true" : "false") << ",\n"
                << "  \"roundtrip_solids\": " << roundtripSolids << ",\n"
                << "  \"roundtrip_shells\": " << roundtripShells << ",\n"
                << "  \"roundtrip_faces\": " << roundtripFaces << ",\n"
                << "  \"roundtrip_volume\": " << roundtripVolume << ",\n"
                << "  \"roundtrip_area\": " << roundtripArea << ",\n"
                << "  \"volume_delta\": " << (roundtripVolume - sourceVolume) << ",\n"
                << "  \"area_delta\": " << (roundtripArea - sourceArea) << ",\n"
                << "  \"topology_pass\": " << (topologyPass ? "true" : "false") << "\n"
                << "}\n";
            out.close();
            std::cout << std::ifstream(report).rdbuf();
            return topologyPass ? 0 : 14;
          }
          CPP
          c++ -std=c++17 -O2 occt8_brep_to_step.cpp -o occt8_brep_to_step \
            -I"$PWD/occt-install/include/opencascade" \
            -L"$PWD/occt-install/lib" \
            -Wl,-rpath,'$ORIGIN/../lib' \
            -lTKDESTEP -lTKDE -lTKXSBase -lTKShHealing -lTKTopAlgo -lTKBRep \
            -lTKGeomAlgo -lTKGeomBase -lTKG3d -lTKG2d -lTKMath -lTKernel

      - name: Smoke-test exact offset-curve round trip
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install 'build123d==0.11.1'
          mkdir -p smoke
          python3 - <<'PY'
          from build123d import Edge, Face, Solid, Vector, Wire
          from OCP.BRepTools import BRepTools
          edges = [
              Edge.make_bezier(Vector(0,0), Vector(5,-4), Vector(15,-4), Vector(20,0)),
              Edge.make_line(Vector(20,0), Vector(20,20)),
              Edge.make_line(Vector(20,20), Vector(0,20)),
              Edge.make_line(Vector(0,20), Vector(0,0)),
          ]
          offset = Wire(edges).offset_2d(2.0)
          if isinstance(offset, list): offset = offset[0]
          body = Solid.extrude(Face(offset), Vector(0,0,5))
          assert body.is_valid and len(body.solids()) == 1
          assert BRepTools.Write_s(body.wrapped, 'smoke/offset_prism.brep')
          PY
          mkdir -p smoke/results
          LD_LIBRARY_PATH="$PWD/occt-install/lib" ./occt8_brep_to_step \
            smoke/offset_prism.brep smoke/results/offset_prism.step smoke/results/report.json

      - name: Package pinned helper and evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact/bin artifact/lib artifact/evidence artifact/smoke
          cp occt8_brep_to_step artifact/bin/
          cp -a occt-install/lib/*.so* artifact/lib/
          cp -a smoke/results/. artifact/smoke/
          printf '%s\n' V8_0_0 > artifact/evidence/OCCT_TAG.txt
          git -C occt rev-parse HEAD > artifact/evidence/OCCT_COMMIT.txt
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/evidence/SHA256SUMS.txt
          tar -C artifact -czf occt8-pinned-brep-to-step-helper.tar.gz .
          sha256sum occt8-pinned-brep-to-step-helper.tar.gz > occt8-pinned-brep-to-step-helper.tar.gz.sha256

      - name: Upload pinned export helper
        uses: actions/upload-artifact@v4
        with:
          name: occt8-pinned-brep-to-step-helper
          path: |
            occt8-pinned-brep-to-step-helper.tar.gz
            occt8-pinned-brep-to-step-helper.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
