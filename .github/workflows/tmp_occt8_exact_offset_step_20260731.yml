name: Temporary OCCT 8 pinned BREP-to-STEP helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-pinned-export-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Build OCCT 8.0.0 data-exchange runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++ git
          git clone --depth 1 --branch V8_0_0 https://github.com/Open-Cascade-SAS/OCCT.git occt
          test "$(git -C occt describe --tags --exact-match)" = "V8_0_0"
          cmake -S occt -B occt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-install" \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_TCL=OFF \
            -DUSE_TK=OFF
          cmake --build occt-build --parallel 4
          cmake --install occt-build

      - name: Build deterministic BREP-to-STEP CLI
        shell: bash
        run: |
          set -euxo pipefail
          cat > occt8_brep_to_step.cpp <<'CPP'
          #include <BRep_Builder.hxx>
          #include <BRepTools.hxx>
          #include <BRepCheck_Analyzer.hxx>
          #include <TopExp_Explorer.hxx>
          #include <TopAbs_ShapeEnum.hxx>
          #include <TopoDS_Shape.hxx>
          #include <STEPControl_Writer.hxx>
          #include <STEPControl_Reader.hxx>
          #include <IFSelect_ReturnStatus.hxx>
          #include <BRepGProp.hxx>
          #include <GProp_GProps.hxx>
          #include <Bnd_Box.hxx>
          #include <BRepBndLib.hxx>
          #include <fstream>
          #include <iomanip>
          #include <iostream>
          #include <string>

          static int count(const TopoDS_Shape& s, TopAbs_ShapeEnum kind) {
            int n = 0;
            for (TopExp_Explorer ex(s, kind); ex.More(); ex.Next()) ++n;
            return n;
          }
          static void props(const TopoDS_Shape& s, double& volume, double& area) {
            GProp_GProps v, a;
            BRepGProp::VolumeProperties(s, v);
            BRepGProp::SurfaceProperties(s, a);
            volume = v.Mass(); area = a.Mass();
          }
          static void bbox(const TopoDS_Shape& s, double out[6]) {
            Bnd_Box b; BRepBndLib::Add(s, b, false); b.Get(out[0],out[1],out[2],out[3],out[4],out[5]);
          }
          int main(int argc, char** argv) {
            if (argc != 4) {
              std::cerr << "usage: occt8_brep_to_step input.brep output.step report.json\n";
              return 2;
            }
            const std::string input = argv[1], output = argv[2], report = argv[3];
            BRep_Builder builder; TopoDS_Shape source;
            std::ifstream in(input);
            if (!in || !BRepTools::Read(source, in, builder)) return 10;
            BRepCheck_Analyzer sourceCheck(source);
            double sv=0, sa=0, sb[6]; props(source,sv,sa); bbox(source,sb);

            STEPControl_Writer writer;
            const auto ts = writer.Transfer(source, STEPControl_ManifoldSolidBrep);
            const auto ws = writer.Write(output.c_str());
            if (ws != IFSelect_RetDone) return 11;

            STEPControl_Reader reader;
            const auto rs = reader.ReadFile(output.c_str());
            if (rs != IFSelect_RetDone) return 12;
            reader.TransferRoots();
            TopoDS_Shape roundtrip = reader.OneShape();
            BRepCheck_Analyzer roundCheck(roundtrip);
            double rv=0, ra=0, rb[6]; props(roundtrip,rv,ra); bbox(roundtrip,rb);

            std::ofstream out(report);
            out << std::setprecision(17)
                << "{\n"
                << "  \"occt_tag\": \"V8_0_0\",\n"
                << "  \"source_valid\": " << (sourceCheck.IsValid()?"true":"false") << ",\n"
                << "  \"source_solids\": " << count(source,TopAbs_SOLID) << ",\n"
                << "  \"source_shells\": " << count(source,TopAbs_SHELL) << ",\n"
                << "  \"source_faces\": " << count(source,TopAbs_FACE) << ",\n"
                << "  \"source_volume\": " << sv << ",\n"
                << "  \"source_area\": " << sa << ",\n"
                << "  \"source_bbox\": [" << sb[0] << ',' << sb[1] << ',' << sb[2] << ',' << sb[3] << ',' << sb[4] << ',' << sb[5] << "],\n"
                << "  \"transfer_status\": " << static_cast<int>(ts) << ",\n"
                << "  \"write_status\": " << static_cast<int>(ws) << ",\n"
                << "  \"roundtrip_valid\": " << (roundCheck.IsValid()?"true":"false") << ",\n"
                << "  \"roundtrip_solids\": " << count(roundtrip,TopAbs_SOLID) << ",\n"
                << "  \"roundtrip_shells\": " << count(roundtrip,TopAbs_SHELL) << ",\n"
                << "  \"roundtrip_faces\": " << count(roundtrip,TopAbs_FACE) << ",\n"
                << "  \"roundtrip_volume\": " << rv << ",\n"
                << "  \"roundtrip_area\": " << ra << ",\n"
                << "  \"roundtrip_bbox\": [" << rb[0] << ',' << rb[1] << ',' << rb[2] << ',' << rb[3] << ',' << rb[4] << ',' << rb[5] << "],\n"
                << "  \"volume_delta\": " << (rv-sv) << ",\n"
                << "  \"area_delta\": " << (ra-sa) << "\n"
                << "}\n";
            std::cout << std::ifstream(report).rdbuf();
            return 0;
          }
          CPP
          c++ -std=c++17 -O2 occt8_brep_to_step.cpp -o occt8_brep_to_step \
            -I"$PWD/occt-install/include/opencascade" \
            -L"$PWD/occt-install/lib" \
            -Wl,-rpath,'$ORIGIN/../lib' \
            -lTKDESTEP -lTKDE -lTKXSBase -lTKShHealing -lTKTopAlgo -lTKBRep \
            -lTKGeomAlgo -lTKGeomBase -lTKG3d -lTKG2d -lTKMath -lTKernel

      - name: Package pinned helper and shared libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact/bin artifact/lib artifact/evidence
          cp occt8_brep_to_step artifact/bin/
          cp -a occt-install/lib/*.so* artifact/lib/
          printf '%s\n' V8_0_0 > artifact/evidence/OCCT_TAG.txt
          git -C occt rev-parse HEAD > artifact/evidence/OCCT_COMMIT.txt
          sha256sum artifact/bin/occt8_brep_to_step artifact/lib/* > artifact/evidence/SHA256SUMS.txt
          tar -C artifact -czf occt8-pinned-brep-to-step-helper.tar.gz .
          sha256sum occt8-pinned-brep-to-step-helper.tar.gz > occt8-pinned-brep-to-step-helper.tar.gz.sha256

      - name: Upload pinned export helper
        uses: actions/upload-artifact@v4
        with:
          name: occt8-pinned-brep-to-step-helper
          path: |
            occt8-pinned-brep-to-step-helper.tar.gz
            occt8-pinned-brep-to-step-helper.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
