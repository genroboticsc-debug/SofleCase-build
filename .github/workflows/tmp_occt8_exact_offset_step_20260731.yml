name: Temporary OCCT 8 exact offset STEP test

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  occt8-offset-roundtrip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate exact OCCT 7.9 offset-curve BREP
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build123d==0.11.1'
          mkdir -p input results
          python - <<'PY'
          from build123d import Edge, Wire, Face, Vector, Solid
          from OCP.BRepTools import BRepTools
          edges = [
              Edge.make_bezier(Vector(0, 0), Vector(5, -4), Vector(15, -4), Vector(20, 0)),
              Edge.make_line(Vector(20, 0), Vector(20, 20)),
              Edge.make_line(Vector(20, 20), Vector(0, 20)),
              Edge.make_line(Vector(0, 20), Vector(0, 0)),
          ]
          source = Wire(edges)
          offset = source.offset_2d(2.0)
          if isinstance(offset, list):
              offset = offset[0]
          body = Solid.extrude(Face(offset), Vector(0, 0, 5))
          assert len(body.solids()) == 1 and len(body.shells()) == 1 and len(body.faces()) == 11
          assert body.is_valid
          assert BRepTools.Write_s(body.wrapped, 'input/exact_offset_prism.brep')
          print(body.volume, body.area)
          PY
      - name: Build OCCT 8.0.0 data-exchange runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ git libfreetype-dev tcl-dev tk-dev libx11-dev libxmu-dev libxi-dev
          git clone --depth 1 --branch V8_0_0 https://github.com/Open-Cascade-SAS/OCCT.git occt
          cmake -S occt -B occt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-install" \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_TCL=OFF \
            -DUSE_TK=OFF
          cmake --build occt-build --parallel 4
          cmake --install occt-build
      - name: Build and run exact STEP round-trip helper
        shell: bash
        run: |
          cat > exact_roundtrip.cpp <<'CPP'
          #include <BRep_Builder.hxx>
          #include <BRepTools.hxx>
          #include <BRepCheck_Analyzer.hxx>
          #include <TopExp_Explorer.hxx>
          #include <TopAbs_ShapeEnum.hxx>
          #include <TopoDS_Shape.hxx>
          #include <STEPControl_Writer.hxx>
          #include <STEPControl_Reader.hxx>
          #include <IFSelect_ReturnStatus.hxx>
          #include <BRepGProp.hxx>
          #include <GProp_GProps.hxx>
          #include <fstream>
          #include <iomanip>
          #include <iostream>

          static int count(const TopoDS_Shape& s, TopAbs_ShapeEnum kind) {
            int n = 0;
            for (TopExp_Explorer ex(s, kind); ex.More(); ex.Next()) ++n;
            return n;
          }
          int main() {
            BRep_Builder builder;
            TopoDS_Shape source;
            std::ifstream in("input/exact_offset_prism.brep");
            if (!BRepTools::Read(source, in, builder)) return 10;
            BRepCheck_Analyzer sourceCheck(source);
            GProp_GProps sv, sa;
            BRepGProp::VolumeProperties(source, sv);
            BRepGProp::SurfaceProperties(source, sa);

            STEPControl_Writer writer;
            auto ts = writer.Transfer(source, STEPControl_ManifoldSolidBrep);
            auto ws = writer.Write("results/occt8_exact_offset_prism.step");

            STEPControl_Reader reader;
            auto rs = reader.ReadFile("results/occt8_exact_offset_prism.step");
            if (rs != IFSelect_RetDone) return 11;
            reader.TransferRoots();
            TopoDS_Shape roundtrip = reader.OneShape();
            BRepCheck_Analyzer roundCheck(roundtrip);
            GProp_GProps rv, ra;
            BRepGProp::VolumeProperties(roundtrip, rv);
            BRepGProp::SurfaceProperties(roundtrip, ra);

            std::ofstream out("results/result.json");
            out << std::setprecision(17)
                << "{\n"
                << "  \"source_valid\": " << (sourceCheck.IsValid() ? "true" : "false") << ",\n"
                << "  \"source_solids\": " << count(source, TopAbs_SOLID) << ",\n"
                << "  \"source_shells\": " << count(source, TopAbs_SHELL) << ",\n"
                << "  \"source_faces\": " << count(source, TopAbs_FACE) << ",\n"
                << "  \"source_volume\": " << sv.Mass() << ",\n"
                << "  \"source_area\": " << sa.Mass() << ",\n"
                << "  \"transfer_status\": " << static_cast<int>(ts) << ",\n"
                << "  \"write_status\": " << static_cast<int>(ws) << ",\n"
                << "  \"roundtrip_valid\": " << (roundCheck.IsValid() ? "true" : "false") << ",\n"
                << "  \"roundtrip_solids\": " << count(roundtrip, TopAbs_SOLID) << ",\n"
                << "  \"roundtrip_shells\": " << count(roundtrip, TopAbs_SHELL) << ",\n"
                << "  \"roundtrip_faces\": " << count(roundtrip, TopAbs_FACE) << ",\n"
                << "  \"roundtrip_volume\": " << rv.Mass() << ",\n"
                << "  \"roundtrip_area\": " << ra.Mass() << "\n"
                << "}\n";
            out.close();
            std::cout << std::ifstream("results/result.json").rdbuf();
            bool pass = sourceCheck.IsValid() && roundCheck.IsValid()
              && count(roundtrip, TopAbs_SOLID) == 1
              && count(roundtrip, TopAbs_SHELL) == 1
              && count(roundtrip, TopAbs_FACE) == count(source, TopAbs_FACE)
              && std::abs(rv.Mass() - sv.Mass()) <= 1e-9
              && std::abs(ra.Mass() - sa.Mass()) <= 1e-9;
            return pass ? 0 : 12;
          }
          CPP
          c++ -std=c++17 -O2 exact_roundtrip.cpp -o exact_roundtrip \
            -I"$PWD/occt-install/include/opencascade" \
            -L"$PWD/occt-install/lib" \
            -Wl,-rpath,"$PWD/occt-install/lib" \
            -lTKDESTEP -lTKDE -lTKXSBase -lTKShHealing -lTKTopAlgo -lTKBRep -lTKGeomAlgo -lTKGeomBase -lTKG3d -lTKG2d -lTKMath -lTKernel
          ./exact_roundtrip
      - name: Upload exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occt8-exact-offset-step-result
          path: results/
          if-no-files-found: warn
          retention-days: 7
