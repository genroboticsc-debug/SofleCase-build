name: Temporary Nemotron APK Build

on:
  pull_request:
    branches:
      - master

jobs:
  build-apk:
    if: github.head_ref == 'nemotron-apk-build-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Android project
        shell: bash
        run: |
          cat .nemotron-build/chunk00 .nemotron-build/chunk01 .nemotron-build/chunk02 | base64 -d > /tmp/NemotronVoice.tar.xz
          mkdir -p /tmp/NemotronVoice
          tar -xJf /tmp/NemotronVoice.tar.xz -C /tmp/NemotronVoice
          test -f /tmp/NemotronVoice/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        working-directory: /tmp/NemotronVoice
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/NemotronVoice/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee /tmp/NemotronVoice-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NemotronVoice-debug-apk
          path: |
            /tmp/NemotronVoice/app/build/outputs/apk/debug/app-debug.apk
            /tmp/NemotronVoice-debug.apk.sha256
            /tmp/apk-badging.txt
          if-no-files-found: error
          retention-days: 7
