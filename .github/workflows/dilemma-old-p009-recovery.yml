name: Dilemma old P009 exact recovery
on:
  push:
    branches: [dilemma-current-failset-20260803]
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Recover historical P009 builder and outputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p recovered
          git rev-list --objects --all > recovered/all_objects.txt
          grep -Ei 'build_measured_stl_features\.py|mech_cases_3x5_2_tenting_puck_tenting_puck_v3_26\.(step|stl)|tenting_puck_v3_26\.(step|stl)' recovered/all_objects.txt > recovered/matches.txt || true
          while read -r sha path; do
            [ -n "${sha:-}" ] || continue
            safe=$(printf '%s' "${path:-blob}" | tr '/\\ ' '___')
            git cat-file -p "$sha" > "recovered/${sha}_${safe}" || true
          done < recovered/matches.txt
          git log --all --full-history --name-status --pretty='format:COMMIT %H %cI %s' -- 'scripts/build_measured_stl_features.py' '*tenting_puck_v3_26*' > recovered/history.log || true
          git fsck --full --no-reflogs --unreachable > recovered/fsck.txt || true
          # Inspect unreachable blobs for identifying strings without assuming paths.
          awk '/unreachable blob/{print $3}' recovered/fsck.txt | while read -r sha; do
            size=$(git cat-file -s "$sha" 2>/dev/null || echo 0)
            if [ "$size" -le 8000000 ]; then
              if git cat-file -p "$sha" 2>/dev/null | grep -aEq 'build_measured_stl_features|tenting_puck_v3_26|14833\.028423|0\.001254'; then
                git cat-file -p "$sha" > "recovered/unreachable_${sha}.bin"
              fi
            fi
          done
          sha256sum recovered/* > recovered/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: dilemma-old-p009-exact-recovery
          path: recovered/
          retention-days: 3
