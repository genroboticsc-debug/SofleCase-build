name: DracuLad Kailh five-branch strategy matrix

on:
  pull_request:
    branches: [master]
    paths:
      - 'draculad_kailh/five_branch_candidate.py'
      - 'draculad_kailh/validate_joint.py'
      - '.github/workflows/draculad-kailh-five-branch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy:
    strategy:
      fail-fast: false
      matrix:
        strategy: [native_fillet, wire_frenet, wire_round, wire_right, individual_union]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CAD and diagnostic stack
        run: python -m pip install 'build123d==0.9.1' 'trimesh>=4.4' 'manifold3d>=3.0'
      - name: Download exact pinned reference
        run: |
          curl --fail --location --retry 5 --output reference.step \
            'https://raw.githubusercontent.com/foostan/kbd/230c6d634a8d409cbd1c506ec0260420a08a1c83/kicad-packages3D/kbd.3dshapes/kailh%20cherry%20socket%20soldered.step'
          echo '0b938e39f0fd84a6b424ef9c49f2c6aa8a232fa2a68f9105a0f9b821c987cc56  reference.step' | sha256sum --check
      - name: Build isolated five-branch candidate
        run: |
          mkdir -p artifacts
          set +e
          timeout 180s env FIVE_BRANCH_STRATEGY='${{ matrix.strategy }}' PYTHONPATH=draculad_kailh \
            python draculad_kailh/five_branch_candidate.py \
            > 'artifacts/${{ matrix.strategy }}_build.log' 2>&1
          code=$?
          echo "$code" > 'artifacts/${{ matrix.strategy }}_build.exit'
          cat 'artifacts/${{ matrix.strategy }}_build.log'
          if [ -f artifacts/five_branch_candidate/candidate_joint.step ]; then
            cp artifacts/five_branch_candidate/candidate_joint.step artifacts/candidate_joint.step
            cp artifacts/five_branch_candidate/candidate_joint.stl artifacts/candidate_joint.stl
            cp artifacts/five_branch_candidate/candidate_build.json 'artifacts/${{ matrix.strategy }}_build.json'
          fi
          exit 0
      - name: Run independent validation
        run: |
          if [ -f artifacts/candidate_joint.step ]; then
            set +e
            timeout 180s python draculad_kailh/validate_joint.py \
              > 'artifacts/${{ matrix.strategy }}_validation.log' 2>&1
            echo "$?" > 'artifacts/${{ matrix.strategy }}_validation.exit'
            cat 'artifacts/${{ matrix.strategy }}_validation.log'
          else
            echo 'candidate not produced' | tee 'artifacts/${{ matrix.strategy }}_validation.log'
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-branch-${{ matrix.strategy }}
          path: artifacts/
          retention-days: 7
