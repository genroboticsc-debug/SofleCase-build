name: SROT manifold dependency bundle

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  manifold-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download manifold3d wheel
        run: |
          python -m pip install --upgrade pip
          mkdir wheelhouse
          python -m pip download --no-deps --dest wheelhouse manifold3d==3.5.2
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS_MANIFOLD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: srot-python313-manifold-wheel
          path: wheelhouse/
          retention-days: 1
