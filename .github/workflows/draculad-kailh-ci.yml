name: DracuLad Kailh exact geometry campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CAD and validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build123d==0.9.1' 'trimesh>=4.4' 'manifold3d>=3.0'
      - name: Download independent pinned reference
        run: |
          curl --fail --location --retry 5 --output reference.step \
            'https://raw.githubusercontent.com/foostan/kbd/230c6d634a8d409cbd1c506ec0260420a08a1c83/kicad-packages3D/kbd.3dshapes/kailh%20cherry%20socket%20soldered.step'
          echo '0b938e39f0fd84a6b424ef9c49f2c6aa8a232fa2a68f9105a0f9b821c987cc56  reference.step' | sha256sum --check
      - name: Decode related native Fusion solder history
        run: |
          mkdir -p artifacts/fusion
          set +e
          curl --fail --location --retry 5 --output artifacts/fusion/d_sod_soldered.f3z \
            'https://raw.githubusercontent.com/foostan/kbd/230c6d634a8d409cbd1c506ec0260420a08a1c83/kicad-packages3D/kbd.3dshapes/D_SOD-123%20Soldered.f3z'
          unzip -o artifacts/fusion/d_sod_soldered.f3z -d artifacts/fusion/f3z > artifacts/fusion/unzip.log 2>&1
          git clone --depth 1 https://github.com/cadmpeg/cadmpeg.git /tmp/cadmpeg > artifacts/fusion/cadmpeg_clone.log 2>&1
          git -C /tmp/cadmpeg fetch --depth 1 origin 43ad613b416d96225fef501b08b0a29e6f982fbe >> artifacts/fusion/cadmpeg_clone.log 2>&1
          git -C /tmp/cadmpeg checkout 43ad613b416d96225fef501b08b0a29e6f982fbe >> artifacts/fusion/cadmpeg_clone.log 2>&1
          cargo build --release --manifest-path /tmp/cadmpeg/Cargo.toml -p cadmpeg > artifacts/fusion/cadmpeg_build.log 2>&1
          exe=/tmp/cadmpeg/target/release/cadmpeg
          "$exe" inspect artifacts/fusion/d_sod_soldered.f3z --json > artifacts/fusion/f3z_inspect.json 2> artifacts/fusion/f3z_inspect.err
          find artifacts/fusion/f3z -type f -iname '*.f3d' -print > artifacts/fusion/f3d_files.txt
          n=0
          while IFS= read -r f; do
            n=$((n+1))
            "$exe" inspect "$f" --json > "artifacts/fusion/f3d_${n}_inspect.json" 2> "artifacts/fusion/f3d_${n}_inspect.err"
            "$exe" decode "$f" -o "artifacts/fusion/f3d_${n}.cadir.json" --force > "artifacts/fusion/f3d_${n}_decode.out" 2> "artifacts/fusion/f3d_${n}_decode.err"
          done < artifacts/fusion/f3d_files.txt
          exit 0
      - name: Package evidence
        if: always()
        run: sha256sum reference.step artifacts/* > artifacts/SHA256SUMS.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draculad-kailh-campaign
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
