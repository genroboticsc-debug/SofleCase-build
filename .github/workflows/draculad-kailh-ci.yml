name: DracuLad Kailh Exact CI

on:
  push:
    branches:
      - draculad-kailh-ci-20260726
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-kailh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact CAD runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.9.1
      - name: Decode isolated input
        run: |
          mkdir -p draculad-ci/work
          base64 -d draculad-ci/input.zip.b64 > draculad-ci/input.zip
          unzip -q draculad-ci/input.zip -d draculad-ci/work
          cp draculad-ci/experiment4.py draculad-ci/work/experiment4.py
      - name: Run exact ordered C0/C1 B-spline test
        env:
          OCP_SHOW: '0'
        run: |
          set -o pipefail
          cd draculad-ci/work
          python experiment4.py 2>&1 | tee output/results4.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draculad-kailh-ci-results
          path: draculad-ci/work/output
          if-no-files-found: warn
