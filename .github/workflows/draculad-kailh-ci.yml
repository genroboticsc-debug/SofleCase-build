name: DracuLad Kailh Exact CI

on:
  push:
    branches:
      - draculad-kailh-ci-20260726
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-kailh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact CAD runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.9.1
      - name: Decode isolated input and fetch pinned reference
        run: |
          mkdir -p draculad-ci/work
          base64 -d draculad-ci/input.zip.b64 > draculad-ci/input.zip
          unzip -q draculad-ci/input.zip -d draculad-ci/work
          cp draculad-ci/experiment13.py draculad-ci/work/experiment13.py
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/foostan/kbd/230c6d634a8d409cbd1c506ec0260420a08a1c83/kicad-packages3D/kbd.3dshapes/kailh%20cherry%20socket%20soldered.step' \
            --output draculad-ci/work/reference.step
          echo '0b938e39f0fd84a6b424ef9c49f2c6aa8a232fa2a68f9105a0f9b821c987cc56  draculad-ci/work/reference.step' | sha256sum --check
      - name: Run adaptive curvature-critical canal sweep
        env:
          OCP_SHOW: '0'
        run: |
          set -o pipefail
          cd draculad-ci/work
          python experiment13.py 2>&1 | tee output/results13.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draculad-kailh-ci-results
          path: draculad-ci/work/output
          if-no-files-found: warn
