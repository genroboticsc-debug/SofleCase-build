name: Temporary P010 P011 OCP Wheelhouse

on:
  push:
    branches: [strict-p010-p011-certification]
    paths: [.github/workflows/tmp-p010-p011-ocp-wheelhouse.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact pinned OCP wheels
        run: |
          set -euxo pipefail
          mkdir -p wheelhouse
          python -m pip download --no-deps --dest wheelhouse \
            cadquery-ocp-novtk==7.9.3.1.1 \
            cadquery-ocp-proxy==7.9.3.1.1
          sha256sum wheelhouse/* | tee wheelhouse/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p010-p011-ocp-python313-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 1
