name: DracuLad Kailh fast candidate validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'draculad_kailh/**'
      - '.github/workflows/draculad-kailh-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-canal-and-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CAD stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build123d==0.9.1' 'trimesh>=4.4' 'manifold3d>=3.0'
      - name: Download pinned reference
        run: |
          curl --fail --location --retry 5 --output reference.step \
            'https://raw.githubusercontent.com/foostan/kbd/230c6d634a8d409cbd1c506ec0260420a08a1c83/kicad-packages3D/kbd.3dshapes/kailh%20cherry%20socket%20soldered.step'
          echo '0b938e39f0fd84a6b424ef9c49f2c6aa8a232fa2a68f9105a0f9b821c987cc56  reference.step' | sha256sum --check
      - name: Test whole-contour canal strategies
        run: |
          mkdir -p artifacts/canal_strategy
          set +e
          for strategy in wire_frenet wire_corrected wire_round individual_union; do
            echo "--- strategy $strategy ---"
            timeout 180s env CANAL_STRATEGY="$strategy" PYTHONPATH=draculad_kailh \
              python draculad_kailh/canal_strategy_probe.py \
              > "artifacts/canal_strategy/${strategy}.log" 2>&1
            echo "$?" > "artifacts/canal_strategy/${strategy}.exit"
            cat "artifacts/canal_strategy/${strategy}.log"
          done
          exit 0
      - name: Evaluate compact fit-point meniscus profiles
        run: |
          mkdir -p artifacts/profile_fit
          set +e
          timeout 180s env PYTHONPATH=draculad_kailh \
            python draculad_kailh/profile_fit_analysis.py \
            > artifacts/profile_fit.log 2>&1
          echo "$?" > artifacts/profile_fit.exit
          cat artifacts/profile_fit.log
          exit 0
      - name: Package source and hashes
        if: always()
        run: |
          cp draculad_kailh/canal_strategy_probe.py artifacts/ || true
          cp draculad_kailh/profile_fit_analysis.py artifacts/ || true
          cp draculad_kailh/swept_cutter_candidate.py artifacts/ || true
          cp draculad_kailh/validate_joint.py artifacts/ || true
          sha256sum reference.step artifacts/* > artifacts/SHA256SUMS.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draculad-kailh-fast
          path: artifacts/
          retention-days: 7
