name: Dilemma KiCad native outline kernel

on:
  pull_request:
    branches: [master]
    paths:
      - .github/dilemma-kicad-outline-trigger.txt

permissions:
  contents: read

jobs:
  extract-native-outlines:
    runs-on: ubuntu-24.04
    steps:
      - name: Install KiCad 9 Python API
        shell: bash
        run: |
          set -euxo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad python3-wxgtk4.0
          kicad-cli --version
      - name: Checkout pinned Dilemma source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/Bastardkb/Dilemma.git upstream
          cd upstream
          git checkout f5cffb4821fe560b095418b71382ac7d8043c61a
      - name: Extract KiCad native board polygon outlines
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence
          cat > /tmp/extract_outlines.py <<'PY'
          import json, hashlib, sys, traceback
          from pathlib import Path
          import pcbnew

          EXPECTED = {
              '3x5_3': 'e914ce82c793044cecededead74a2af642506f2a6345d758b3c152c649e142c6',
              '3x5_3_procyon': '79635af892b3a755ffaacccd17307e3f19316687a3b2ab7f95d78a84df6adff1',
              '4x6_4': '1e22900adffdd4c14adf82420ab2d66558e5f3a44815a7c89627e432300f7262',
          }

          def point(chain, i):
              for name in ('CPoint','Point'):
                  if hasattr(chain, name):
                      p = getattr(chain, name)(i)
                      return [pcbnew.ToMM(p.x), pcbnew.ToMM(p.y)]
              p = chain[i]
              return [pcbnew.ToMM(p.x), pcbnew.ToMM(p.y)]

          def chain_json(chain):
              n = chain.PointCount() if hasattr(chain,'PointCount') else len(chain)
              return {
                  'point_count': int(n),
                  'closed': bool(chain.IsClosed()) if hasattr(chain,'IsClosed') else None,
                  'points_mm': [point(chain, i) for i in range(n)],
              }

          results = {'pcbnew_version': pcbnew.Version(), 'families': {}}
          for family, expected in EXPECTED.items():
              path = Path('upstream') / family / 'dilemma.kicad_pcb'
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise RuntimeError(f'{family}: SHA mismatch {actual}')
              board = pcbnew.LoadBoard(str(path))
              poly = pcbnew.SHAPE_POLY_SET()
              call = {'success': False, 'return_repr': None, 'error': None}
              try:
                  ret = board.GetBoardPolygonOutlines(poly)
                  call['success'] = True
                  call['return_repr'] = repr(ret)
              except Exception as exc:
                  call['error'] = f'{type(exc).__name__}: {exc}'
                  call['traceback'] = traceback.format_exc()
              fam = {
                  'source': str(path), 'sha256': actual,
                  'call': call,
                  'poly_methods': [x for x in dir(poly) if any(k in x.lower() for k in ('outline','hole','point','fracture','simplify','boolean'))],
                  'board_methods': [x for x in dir(board) if 'outline' in x.lower()],
                  'outlines': [],
              }
              if call['success']:
                  count = poly.OutlineCount()
                  for oi in range(count):
                      item = {'outline_index': oi, 'outline': chain_json(poly.Outline(oi)), 'holes': []}
                      hc = poly.HoleCount(oi) if hasattr(poly,'HoleCount') else 0
                      for hi in range(hc):
                          item['holes'].append(chain_json(poly.Hole(oi, hi)))
                      fam['outlines'].append(item)
              results['families'][family] = fam
          Path('evidence/KICAD_NATIVE_BOARD_POLYGON_OUTLINES.json').write_text(json.dumps(results, indent=2))
          print(json.dumps({k: {'success':v['call']['success'], 'outlines':len(v['outlines']), 'error':v['call']['error']} for k,v in results['families'].items()}, indent=2))
          PY
          PYTHONPATH=/usr/lib/python3/dist-packages python3 /tmp/extract_outlines.py
          sha256sum evidence/* > evidence/SHA256SUMS.txt
      - name: Upload exact outline evidence
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-kicad-native-outline-kernel
          path: evidence/
          if-no-files-found: error
          retention-days: 1
