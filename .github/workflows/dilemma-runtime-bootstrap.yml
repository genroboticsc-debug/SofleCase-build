name: Temporary DracuLad Kailh exact search

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/dilemma-runtime-bootstrap.yml
      - .github/dilemma-runtime-bootstrap-trigger.txt
      - draculad_kailh/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out temporary search branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact CAD runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build123d==0.9.1
          python - <<'PY'
          import build123d
          print('build123d import OK:', build123d.__file__)
          PY

      - name: Fetch pinned Kailh reference
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/kbd-reference
          git -C /tmp/kbd-reference remote add origin https://github.com/foostan/kbd.git
          git -C /tmp/kbd-reference fetch --depth=1 origin 230c6d634a8d409cbd1c506ec0260420a08a1c83
          git -C /tmp/kbd-reference checkout --detach FETCH_HEAD
          cp '/tmp/kbd-reference/kicad-packages3D/kbd.3dshapes/kailh cherry socket soldered.step' draculad_kailh/kailh_reference.step
          echo '0b938e39f0fd84a6b424ef9c49f2c6aa8a232fa2a68f9105a0f9b821c987cc56  draculad_kailh/kailh_reference.step' | sha256sum --check --strict

      - name: Run exact feature search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p draculad_kailh/results
          python draculad_kailh/kailh_search.py 2>&1 | tee draculad_kailh/results/search.log

      - name: Upload exact search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draculad-kailh-exact-search
          path: draculad_kailh/results
          if-no-files-found: warn
          retention-days: 1
