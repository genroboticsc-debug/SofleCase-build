name: Temporary Build123d validation wheelhouse

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/dilemma-runtime-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Linux CPython 3.13 validation wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse \
            build123d==0.11.1 manifold3d==3.5.2 trimesh==4.11.1
          ls -lh wheelhouse
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: build123d-manifold-trimesh-linux-cp313-wheelhouse
          path: wheelhouse
          retention-days: 1
