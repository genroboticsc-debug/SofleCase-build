name: Temporary Dilemma exact-runtime bootstrap

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/dilemma-runtime-bootstrap.yml
      - .github/dilemma-runtime-bootstrap-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build complete exact CAD runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p bundle/site-packages

          # Main locked CAD and Boolean packages. The no-VTK OCP build provides
          # the same OCP Python modules without the unnecessary visualization stack.
          python -m pip install --target bundle/site-packages --no-deps \
            build123d==0.11.1 \
            cadquery-ocp-novtk==7.9.3.1.1 \
            manifold3d==3.5.2

          # Runtime dependencies declared by Build123d and its vector import/export stack.
          python -m pip install --target bundle/site-packages \
            anytree \
            ezdxf \
            numpy==2.3.5 \
            ocpsvg \
            py-lib3mf \
            scipy \
            svgpathtools \
            typing-extensions

          PYTHONPATH="$PWD/bundle/site-packages" python - <<'PY'
          import build123d, OCP, manifold3d, numpy, scipy, trimesh
          from pathlib import Path
          print('build123d', getattr(build123d, '__version__', 'unknown'))
          print('OCP import OK')
          print('manifold3d', getattr(manifold3d, '__version__', 'unknown'))
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('trimesh', trimesh.__version__)
          Path('bundle/RUNTIME_IMPORT_PASS.txt').write_text('build123d OCP manifold3d imports PASS\n')
          PY

      - name: Fetch exact pinned Dilemma references
        shell: bash
        run: |
          set -euo pipefail
          git init dilemma-reference
          git -C dilemma-reference remote add origin https://github.com/Bastardkb/Dilemma.git
          git -C dilemma-reference fetch --depth=1 origin f5cffb4821fe560b095418b71382ac7d8043c61a
          git -C dilemma-reference checkout --detach FETCH_HEAD

          mkdir -p bundle/reference
          while IFS= read -r relative_path; do
            mkdir -p "bundle/reference/$(dirname "$relative_path")"
            cp "dilemma-reference/$relative_path" "bundle/reference/$relative_path"
          done <<'EOF'
          mechanical/cases/3x5_2/tenting_puck/tenting_puck_v3_26.stl
          mechanical/cases/3x5_2/tenting_puck_hex/Dilemma Case Integrated Tenting Puck.STL
          mechanical/cases/3x5_2/tenting_puck_hex/Dilemma Case Tenting Puck Opening.STL
          mechanical/cases/3x5_2/tenting_puck_hex/STEP/Dilemma Case Integrated Tenting Puck.STEP
          mechanical/cases/3x5_2/tenting_puck_hex/STEP/Dilemma Case Tenting Puck Opening.STEP
          mechanical/cases/3x5_2/thin/dilemma_nuts v27.step
          mechanical/cases/3x5_2/thin/thin_v1_26.stl
          mechanical/cases/3x5_3_hotswap/mid.stl
          mechanical/cases/4x6_4/top.stl
          mechanical/cases/4x6_4_hotswap/mid.stl
          EOF

          printf '%s\n' 'f5cffb4821fe560b095418b71382ac7d8043c61a' > bundle/DILEMMA_REFERENCE_COMMIT.txt
          find bundle/reference -type f -print0 | sort -z | xargs -0 sha256sum > bundle/REFERENCE_SHA256SUMS.txt
          find bundle/site-packages -type f -print0 | sort -z | xargs -0 sha256sum > bundle/RUNTIME_SHA256SUMS.txt

      - name: Upload exact runtime and references
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-exact-runtime-and-references
          path: bundle
          if-no-files-found: error
          retention-days: 1
