name: Dilemma 2026-08-27 supplied SROT validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'dilemma-three-fix/**'
      - 'dilemma-srot-20260827/**'
      - '.github/workflows/dilemma-srot-20260827.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-three-part-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned CAD and supplied-validator runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1 manifold3d==3.5.2 trimesh==4.8.3 networkx==3.5

      - name: Decode retained production checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scripts work/reference work/generated work/validation
          base64 -d dilemma-three-fix/p019.py.xz.b64 | xz -d > work/scripts/dilemma_3x5_3_hotswap_mid.py
          cat dilemma-three-fix/p025.part-* | base64 -d | xz -d > work/scripts/dilemma_4x6_4_top.py
          base64 -d dilemma-three-fix/p029.py.xz.b64 | xz -d > work/scripts/dilemma_4x6_4_hotswap_mid.py
          base64 -d dilemma-three-fix/targeted_driver.py.xz.b64 | xz -d > work/targeted_driver.py
          cp dilemma-srot-20260827/validation/Validation_all.py work/validation/Validation_all.py
          python -m py_compile work/scripts/*.py work/targeted_driver.py work/validation/Validation_all.py

      - name: Fetch pinned authoritative STL references
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Bastardkb/Dilemma.git upstream
          git -C upstream checkout f5cffb4821fe560b095418b71382ac7d8043c61a -- \
            mechanical/cases/3x5_3_hotswap/mid.stl \
            mechanical/cases/4x6_4/top.stl \
            mechanical/cases/4x6_4_hotswap/mid.stl
          cp upstream/mechanical/cases/3x5_3_hotswap/mid.stl work/reference/dilemma_3x5_3_hotswap_mid.stl
          cp upstream/mechanical/cases/4x6_4/top.stl work/reference/dilemma_4x6_4_top.stl
          cp upstream/mechanical/cases/4x6_4_hotswap/mid.stl work/reference/dilemma_4x6_4_hotswap_mid.stl
          test "$(sha256sum work/reference/dilemma_3x5_3_hotswap_mid.stl | cut -d' ' -f1)" = "2acf8babae79ea185233231353c4bbcfa924c25411d46ac909c596fa89886070"
          test "$(sha256sum work/reference/dilemma_4x6_4_top.stl | cut -d' ' -f1)" = "0c273a18158a01a4e4eaf0a86263d7e6ef61716afa1fddbf06759c5bbf9af718"
          test "$(sha256sum work/reference/dilemma_4x6_4_hotswap_mid.stl | cut -d' ' -f1)" = "064bc85b03efc1981160cc7861fc146a87c8045302901a9c618e88eb19d6d349"

      - name: Fresh standalone rebuild
        shell: bash
        working-directory: work
        run: |
          set +e
          mkdir -p validation/build_logs
          : > validation/build_status.txt
          for stem in dilemma_3x5_3_hotswap_mid dilemma_4x6_4_top dilemma_4x6_4_hotswap_mid; do
            rm -f generated/${stem}.step generated/${stem}.stp generated/${stem}.stl
            python scripts/${stem}.py --output-dir generated > validation/build_logs/${stem}.log 2>&1
            rc=$?
            echo "${stem} rc=${rc}" | tee -a validation/build_status.txt
          done
          python targeted_driver.py > validation/targeted_driver.log 2>&1 || true
          cat validation/build_status.txt
          cat validation/targeted_driver.log || true

      - name: Mandatory exact inventory preflight
        shell: bash
        working-directory: work
        run: |
          set +e
          : > validation/inventory_preflight.txt
          status=0
          for stem in dilemma_3x5_3_hotswap_mid dilemma_4x6_4_top dilemma_4x6_4_hotswap_mid; do
            for ext in step stl; do
              if [ -s generated/${stem}.${ext} ]; then
                echo "OK generated/${stem}.${ext}" >> validation/inventory_preflight.txt
              else
                echo "MISSING generated/${stem}.${ext}" >> validation/inventory_preflight.txt
                status=1
              fi
            done
            if [ ! -s reference/${stem}.stl ]; then
              echo "MISSING reference/${stem}.stl" >> validation/inventory_preflight.txt
              status=1
            fi
          done
          echo "inventory_status=${status}" >> validation/inventory_preflight.txt
          cat validation/inventory_preflight.txt
          echo "${status}" > validation/inventory_status.code
          exit 0

      - name: Run supplied Validation_all.py unchanged
        shell: bash
        working-directory: work/validation
        run: |
          set +e
          python Validation_all.py 2>&1 | tee supplied_validator.log
          rc=${PIPESTATUS[0]}
          echo "validator_rc=${rc}" >> supplied_validator.log
          exit 0

      - name: Summarize current five-gate evidence
        shell: bash
        working-directory: work
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          report = Path('validation/validation_report.csv')
          rows = []
          if report.exists():
              with report.open(newline='') as f:
                  rows = list(csv.DictReader(f))
          wanted = {
              'dilemma_3x5_3_hotswap_mid.stl',
              'dilemma_4x6_4_top.stl',
              'dilemma_4x6_4_hotswap_mid.stl',
          }
          compared = {r.get('Generated_File','') for r in rows}
          missing = sorted(wanted - compared)
          summary = {
              'compared_rows': len(rows),
              'required_stl_rows': len(wanted),
              'missing_comparisons': missing,
              'rows': rows,
          }
          Path('validation/current_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-srot-20260827-fresh-baseline
          path: |
            work/scripts/
            work/reference/
            work/generated/
            work/validation/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce current submission gate
        if: always()
        shell: bash
        working-directory: work
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          required = {
              'dilemma_3x5_3_hotswap_mid.stl',
              'dilemma_4x6_4_top.stl',
              'dilemma_4x6_4_hotswap_mid.stl',
          }
          inv = int(Path('validation/inventory_status.code').read_text().strip()) if Path('validation/inventory_status.code').exists() else 1
          rows=[]
          p=Path('validation/validation_report.csv')
          if p.exists():
              with p.open(newline='') as f: rows=list(csv.DictReader(f))
          by_name={r.get('Generated_File',''):r for r in rows}
          missing=required-set(by_name)
          failed=[name for name in required if name in by_name and by_name[name].get('OVERALL_PASS') != 'True']
          if inv or missing or failed:
              print('STRICT SROT BASELINE FAIL')
              print('inventory_fail=', bool(inv))
              print('missing_comparisons=', sorted(missing))
              print('failed_rows=', sorted(failed))
              raise SystemExit(1)
          print('STRICT SROT BASELINE PASS')
          PY
