name: DracuLad Kailh five-branch reconstruction

on:
  pull_request:
    branches: [master]
    paths:
      - 'draculad_kailh/**'
      - '.github/workflows/draculad-kailh-five-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Build123d
        run: python -m pip install 'build123d==0.9.1'
      - name: Download exact pinned reference
        run: |
          curl --fail --location --retry 5 --output reference.step \
            'https://raw.githubusercontent.com/foostan/kbd/230c6d634a8d409cbd1c506ec0260420a08a1c83/kicad-packages3D/kbd.3dshapes/kailh%20cherry%20socket%20soldered.step'
          echo '0b938e39f0fd84a6b424ef9c49f2c6aa8a232fa2a68f9105a0f9b821c987cc56  reference.step' | sha256sum --check
      - name: Run exact five-branch campaign
        run: |
          mkdir -p artifacts/five_branch
          set +e
          timeout 360s env PYTHONPATH=draculad_kailh \
            python draculad_kailh/five_branch_analysis.py \
            > artifacts/five_branch.log 2>&1
          echo "$?" > artifacts/five_branch.exit
          cat artifacts/five_branch.log
          exit 0
      - name: Package evidence
        if: always()
        run: |
          cp draculad_kailh/five_branch_analysis.py artifacts/ || true
          cp draculad_kailh/validate_joint.py artifacts/ || true
          sha256sum reference.step artifacts/* > artifacts/SHA256SUMS.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draculad-kailh-five-branch
          path: artifacts/
          retention-days: 7
