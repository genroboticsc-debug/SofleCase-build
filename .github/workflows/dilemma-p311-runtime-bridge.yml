name: Dilemma P311 Runtime Bridge

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download exact runtime wheels
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse \
            build123d==0.11.1 \
            manifold3d==3.5.2 \
            numpy==2.3.5 \
            trimesh==4.11.1
          rm -f wheelhouse/cadquery_ocp*.whl wheelhouse/vtk*.whl
          sha256sum wheelhouse/* | sort > wheelhouse/SHA256SUMS.txt

      - name: Upload runtime wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-p311-runtime-wheelhouse
          path: wheelhouse/
          compression-level: 0
          retention-days: 1
