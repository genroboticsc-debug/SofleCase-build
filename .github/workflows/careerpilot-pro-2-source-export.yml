name: CareerPilot Pro 2 Source Export

on:
  push:
    branches:
      - careerpilot-pro-v1-20260803
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE="CareerPilotAI_Pro_2.0.0_source.tar.xz"
          cat careerpilot_build/pro_v2/chunks/part{00..23} > "$SOURCE"
          echo "8801d9153864d3da6d90075fbda17c49b84d2a427d2349baf32551370e767b24  $SOURCE" | sha256sum -c -
          mkdir -p source
          tar -xJf "$SOURCE" -C source
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-2-source
          path: source/CareerPilotAI
          if-no-files-found: error
          retention-days: 1
