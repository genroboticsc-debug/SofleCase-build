name: Dilemma exact topology batch 3

on:
  pull_request:
    branches: [dilemma-current-failset-20260803]
    paths:
      - .github/workflows/dilemma-fast2.yml

permissions:
  contents: read

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CAD and Boolean runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d==0.11.1 manifold3d==3.5.2 trimesh==4.8.3 networkx==3.5
      - name: Decode retained checkpoint and generate references
        run: |
          set -euxo pipefail
          mkdir -p dilemma-runner
          cat dilemma-runner/project.tar.xz.b64.part-* | base64 --decode > dilemma-runner/project.tar.xz
          tar -xJf dilemma-runner/project.tar.xz -C dilemma-runner
          rm -rf dilemma-runner/upstream
          git clone --filter=blob:none https://github.com/Bastardkb/Dilemma.git dilemma-runner/upstream
          git -C dilemma-runner/upstream checkout f5cffb4821fe560b095418b71382ac7d8043c61a
          python dilemma-runner/project/prepare_and_run.py || true
      - name: Inject exact single-profile scripts
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin agent/dilemma-fast-pass-20260804
          for name in dilemma_3x5_3_hotswap_bottom.py dilemma_3x5_3_hotswap_plate_left.py dilemma_3x5_3_hotswap_plate_right.py; do
            git show FETCH_HEAD:dilemma-fast/scripts/${name}.xz.b64 | base64 --decode | xz --decompress > dilemma-runner/project/scripts/$name
          done
          python -m py_compile dilemma-runner/project/scripts/dilemma_3x5_3_hotswap_bottom.py dilemma-runner/project/scripts/dilemma_3x5_3_hotswap_plate_left.py dilemma-runner/project/scripts/dilemma_3x5_3_hotswap_plate_right.py
      - name: Fresh-build and validate
        env:
          OCP_SHOW: '0'
          PYTHONUNBUFFERED: '1'
        working-directory: dilemma-runner/project
        run: |
          set +e
          mkdir -p validation/fast_build_logs generated XYZ/generated
          for stem in dilemma_3x5_3_hotswap_bottom dilemma_3x5_3_hotswap_plate_left dilemma_3x5_3_hotswap_plate_right; do
            rm -f generated/$stem.step generated/$stem.stl XYZ/generated/$stem.stl
            timeout 900 python scripts/$stem.py --output-dir generated > validation/fast_build_logs/$stem.log 2>&1
            rc=$?
            echo returncode=$rc >> validation/fast_build_logs/$stem.log
            if [ "$rc" -eq 0 ] && [ -s generated/$stem.step ] && [ -s generated/$stem.stl ]; then cp generated/$stem.stl XYZ/generated/$stem.stl; fi
          done
          python validation/Final_validation_check.py --only P018 P021 P022 || true
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('validation/validation_report.json')
          d=json.loads(p.read_text()) if p.exists() else {'rows':[]}
          rows=d.get('rows',[])
          keys=['Canonical_Part_ID','Overall_PASS','Boolean_Success','Generated_STL_Watertight_PASS','Exact_0.01pct_Aspiration_PASS','Symmetric_Difference_%','Volume_Error_%','Area_Error_%','BBox_X_Diff_mm','BBox_Y_Diff_mm','BBox_Z_Diff_mm','COM_Shift_mm','Failure_Reason']
          clean=lambda v: None if isinstance(v,float) and not math.isfinite(v) else v
          s={'validated':len(rows),'official_pass_count':sum(bool(r.get('Overall_PASS')) for r in rows),'below_0_01_percent_count':sum(bool(r.get('Exact_0.01pct_Aspiration_PASS')) for r in rows),'parts':[{k:clean(r.get(k)) for k in keys} for r in rows]}
          Path('validation/fast_exact_summary.json').write_text(json.dumps(s,indent=2,allow_nan=False)+'\n')
          print(json.dumps(s,indent=2,allow_nan=False))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-exact-single-profile-3
          overwrite: true
          path: |
            dilemma-runner/project/generated/dilemma_3x5_3_hotswap_bottom.*
            dilemma-runner/project/generated/dilemma_3x5_3_hotswap_plate_left.*
            dilemma-runner/project/generated/dilemma_3x5_3_hotswap_plate_right.*
            dilemma-runner/project/validation/fast_build_logs/
            dilemma-runner/project/validation/validation_report.json
            dilemma-runner/project/validation/validation_report.csv
            dilemma-runner/project/validation/validationoutput.txt
            dilemma-runner/project/validation/fast_exact_summary.json
          if-no-files-found: warn
          retention-days: 3
