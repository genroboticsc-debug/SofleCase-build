name: CareerPilot AI Android APK

on:
  push:
    branches:
      - careerpilot-apk-build-20260802
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reassemble and verify exact source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat careerpilot_build/v2/p* > careerpilot_project.b64
          base64 --decode careerpilot_project.b64 > careerpilot_project.zip
          echo "19e06f3c7e71b0cf49da6a6f92edfe0697f229460b62cdabb2e45037f0808dac  careerpilot_project.zip" | sha256sum -c -
          rm -rf build-src
          mkdir build-src
          unzip -q careerpilot_project.zip -d build-src
          test -f build-src/CareerPilotAI/settings.gradle.kts
          test -f build-src/CareerPilotAI/app/build.gradle.kts

      - name: Compile tests and package debug APK
        working-directory: build-src/CareerPilotAI
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CareerPilotAI.apk"
          sha256sum "$GITHUB_WORKSPACE/CareerPilotAI.apk" > "$GITHUB_WORKSPACE/CareerPilotAI.apk.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Android-APK
          path: |
            CareerPilotAI.apk
            CareerPilotAI.apk.sha256
          if-no-files-found: error
          retention-days: 1
