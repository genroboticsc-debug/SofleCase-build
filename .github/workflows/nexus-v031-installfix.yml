name: Nexus Jarvis v0.3.1 Install Fix

on:
  pull_request:
    branches:
      - master

jobs:
  build-apk:
    if: github.head_ref == 'nexus-voice-v030-build-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and patch clean package identity
        shell: bash
        run: |
          cat .nexus-v030/chunk00.b64 .nexus-v030/chunk01.b64 .nexus-v030/chunk02.b64 | base64 -d > /tmp/NemotronVoice_v030.tar.xz
          mkdir -p /tmp/nexus
          tar -xJf /tmp/NemotronVoice_v030.tar.xz -C /tmp/nexus
          APP=/tmp/nexus/NemotronVoice_v030
          sed -i "s/applicationId 'com.nexus.nemotronvoice'/applicationId 'com.nexus.jarvisvoice'/" "$APP/app/build.gradle"
          sed -i "s/versionCode 3/versionCode 4/" "$APP/app/build.gradle"
          sed -i "s/versionName '0.3.0'/versionName '0.3.1'/" "$APP/app/build.gradle"
          sed -i 's/android:label="Nexus Voice"/android:label="Nexus Jarvis"/' "$APP/app/src/main/AndroidManifest.xml"
          sed -i 's/android:name=".MainActivity"/android:name="com.nexus.nemotronvoice.MainActivity"/' "$APP/app/src/main/AndroidManifest.xml"
          sed -i 's/android:name=".automation.AssistantAccessibilityService"/android:name="com.nexus.nemotronvoice.automation.AssistantAccessibilityService"/' "$APP/app/src/main/AndroidManifest.xml"
          grep -q "applicationId 'com.nexus.jarvisvoice'" "$APP/app/build.gradle"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile clean-install APK
        working-directory: /tmp/nexus/NemotronVoice_v030
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify package and signature
        shell: bash
        run: |
          APK=/tmp/nexus/NemotronVoice_v030/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/nexus-v031-badging.txt
          grep -q "package: name='com.nexus.jarvisvoice'" /tmp/nexus-v031-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/nexus-v031-signature.txt
          sha256sum "$APK" | tee /tmp/NexusJarvis-v0.3.1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NexusJarvis-v0.3.1-clean-install
          path: |
            /tmp/nexus/NemotronVoice_v030/app/build/outputs/apk/debug/app-debug.apk
            /tmp/NexusJarvis-v0.3.1.apk.sha256
            /tmp/nexus-v031-badging.txt
            /tmp/nexus-v031-signature.txt
          if-no-files-found: error
          retention-days: 7
