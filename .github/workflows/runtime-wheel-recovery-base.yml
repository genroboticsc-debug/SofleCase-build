name: Runtime wheel recovery PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  BUILD123D_FILE: build123d-0.11.1-py3-none-any.whl
  BUILD123D_SHA256: 4e95fa7ccbdc83e624313be492e7c4f5f0eb2ea1df36130eb718bb0c25a89e10
  BUILD123D_URL: https://files.pythonhosted.org/packages/e7/f2/c466dbd4cb3aa75a192ba39f1a49058f828fcc0eb6f9cf6936ed6078308b/build123d-0.11.1-py3-none-any.whl
  MANIFOLD_FILE: manifold3d-3.5.2-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
  MANIFOLD_SHA256: bbfd7a445aeeb24d1e17749e742c637db69fd15f6005ace3fb1a8bfa52beae45
  MANIFOLD_URL: https://files.pythonhosted.org/packages/43/71/3399b1f669e43391bbd199041bf3baf2f92c1fe374791c622dfb80d7c1fa/manifold3d-3.5.2-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
  SVGELEMENTS_FILE: svgelements-1.9.6-py2.py3-none-any.whl
  SVGELEMENTS_SHA256: 8a5cf2cc066d98e713d5b875b1d6e5eeb9b92e855e835ebd7caab2713ae1dcad
  WEBCOLORS_FILE: webcolors-24.8.0-py3-none-any.whl
  WEBCOLORS_SHA256: fc4c3b59358ada164552084a8ebee637c221e4059267d0f8325b3b560f6c7f0a

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - name: Download and verify exact pinned wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheels
          curl --fail --location --retry 5 --output "wheels/${BUILD123D_FILE}" "${BUILD123D_URL}"
          curl --fail --location --retry 5 --output "wheels/${MANIFOLD_FILE}" "${MANIFOLD_URL}"
          python -m pip download --only-binary=:all: --no-deps --dest wheels svgelements==1.9.6 webcolors==24.8.0
          printf '%s  %s\n' "${BUILD123D_SHA256}" "wheels/${BUILD123D_FILE}" > wheels/SHA256SUMS.txt
          printf '%s  %s\n' "${MANIFOLD_SHA256}" "wheels/${MANIFOLD_FILE}" >> wheels/SHA256SUMS.txt
          printf '%s  %s\n' "${SVGELEMENTS_SHA256}" "wheels/${SVGELEMENTS_FILE}" >> wheels/SHA256SUMS.txt
          printf '%s  %s\n' "${WEBCOLORS_SHA256}" "wheels/${WEBCOLORS_FILE}" >> wheels/SHA256SUMS.txt
          sha256sum --check wheels/SHA256SUMS.txt
      - name: Upload exact CAD runtime wheels
        uses: actions/upload-artifact@v4
        with:
          name: exact-cad-runtime-wheels-cp313
          path: wheels/
          if-no-files-found: error
          retention-days: 1
