name: SROT dependency bundle

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact runtime wheels
        run: |
          python -m pip install --upgrade pip
          mkdir wheelhouse
          python -m pip download --no-deps --dest wheelhouse \
            build123d==0.11.1 \
            ezdxf==1.4.2 \
            svgpathtools==1.7.1 \
            ocpsvg==0.6.0 \
            ocp-gordon==0.2.0 \
            trianglesolver==1.2 \
            lib3mf==2.4.1 \
            webcolors==24.11.1
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: srot-python313-wheelhouse
          path: wheelhouse/
          retention-days: 1
