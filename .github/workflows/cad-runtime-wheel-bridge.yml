name: CAD Runtime Wheel Bridge

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact CAD runtime wheels
        run: |
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps --dest wheels \
            build123d==0.11.1 \
            cadquery-ocp-novtk==7.9.3.1.1 \
            cadquery-ocp-proxy==7.9.3.1.1 \
            manifold3d==3.5.2 \
            ocpsvg==0.6.0 \
            svgelements==1.9.6 \
            ocp_gordon==0.2.2 \
            svgpathtools==1.7.2 \
            trianglesolver==1.2 \
            lib3mf==2.5.0 \
            webcolors==24.8.0
          (cd wheels && sha256sum * | sort > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-wheelhouse-py313
          path: wheels/
          if-no-files-found: error
          retention-days: 1
