name: Temporary build123d wheelhouse

on:
  push:
    branches:
      - tmp-build123d-wheelhouse-20260728
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact build123d runtime wheelhouse
        shell: bash
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse 'build123d==0.10.0'
          python -m pip download --only-binary=:all: --dest wheelhouse 'trimesh>=4,<5' 'manifold3d>=3,<4'
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('wheelhouse')
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: build123d-0.10.0-python313-linux-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
