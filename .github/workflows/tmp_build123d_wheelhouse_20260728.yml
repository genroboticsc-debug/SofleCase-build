name: Temporary build123d CPython 3.11 exact wheelhouse

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact CAD and Boolean runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse \
            'build123d==0.11.1' \
            'cadquery-ocp-novtk==7.9.3.1.1' \
            'manifold3d==3.5.2' \
            'trimesh==4.11.1' \
            'numpy==2.3.5'
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('wheelhouse')
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
          grep 'build123d-0.11.1-py3-none-any.whl' wheelhouse/SHA256SUMS.txt
          grep 'cadquery_ocp_novtk-7.9.3.1.1-cp311' wheelhouse/SHA256SUMS.txt
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: build123d-0.11.1-cpython311-exact-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
