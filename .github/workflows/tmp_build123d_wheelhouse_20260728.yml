name: Temporary build123d missing runtime deps

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download missing runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse \
            'requests>=2,<3' \
            'scikit-learn>=1,<2'
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('wheelhouse')
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: build123d-0.11.1-missing-runtime-deps
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
