name: Temporary build123d 0.11.1 wheelhouse

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact project runtime wheels
        shell: bash
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --no-deps --dest wheelhouse \
            'build123d==0.11.1' \
            'manifold3d==3.5.2' \
            'trimesh==4.11.1' \
            'numpy==2.3.5' \
            'svgpathtools==1.7.2' \
            'svgelements==1.9.6' \
            'ezdxf==1.4.2' \
            'ocpsvg==0.6.0' \
            'ocp_gordon==0.2.1' \
            'trianglesolver==1.2' \
            'lib3mf==2.4.1'
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('wheelhouse')
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: build123d-0.11.1-exact-project-wheels
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
