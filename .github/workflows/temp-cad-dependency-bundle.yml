name: Temporary CAD dependency bundle

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact CAD wheels
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheels
          python -m pip download --only-binary=:all: --dest wheels \
            build123d==0.11.1 \
            cadquery-ocp-novtk==7.9.3.1.1
          ls -lh wheels
      - uses: actions/upload-artifact@v4
        with:
          name: cad-wheels-cp313-linux
          path: wheels
          if-no-files-found: error
          retention-days: 1
