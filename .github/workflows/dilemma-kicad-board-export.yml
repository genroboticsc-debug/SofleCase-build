name: Dilemma KiCad board reference export

on:
  pull_request:
    branches: [master]
    paths:
      - .github/dilemma-kicad-export-trigger.txt

permissions:
  contents: read

jobs:
  export-board-only-step:
    runs-on: ubuntu-latest
    steps:
      - name: Install KiCad CLI
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli --version
      - name: Checkout pinned upstream Dilemma source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/Bastardkb/Dilemma.git upstream
          cd upstream
          git checkout f5cffb4821fe560b095418b71382ac7d8043c61a
      - name: Verify source hashes and export board-only STEP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p exports
          declare -A EXPECTED=(
            [3x5_2]=beb07242dc9ff03ebfbb1042de0e5fdb93db4815514bf22d1e6e6e0d09d5bfe1
            [3x5_3]=e914ce82c793044cecededead74a2af642506f2a6345d758b3c152c649e142c6
            [3x5_3_procyon]=79635af892b3a755ffaacccd17307e3f19316687a3b2ab7f95d78a84df6adff1
            [4x6_4]=1e22900adffdd4c14adf82420ab2d66558e5f3a44815a7c89627e432300f7262
          )
          for family in 3x5_2 3x5_3 3x5_3_procyon 4x6_4; do
            pcb="upstream/${family}/dilemma.kicad_pcb"
            test -f "$pcb"
            printf '%s  %s\n' "${EXPECTED[$family]}" "$pcb" | sha256sum -c -
            kicad-cli pcb export step --board-only --drill-origin --force -o "exports/${family}.step" "$pcb"
          done
          sha256sum exports/*.step > exports/STEP_SHA256SUMS.txt
      - name: Upload native board-only STEP files
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-native-kicad-board-only-step
          path: exports/
          if-no-files-found: error
          retention-days: 1
