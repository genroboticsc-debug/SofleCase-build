name: PaperPilot Android APK

on:
  pull_request:
    branches: [master]
    paths:
      - 'paperpilot-android/**'
      - '.github/workflows/paperpilot-apk-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Expand source package
        run: |
          set -euo pipefail
          mkdir -p paperpilot-build
          cat paperpilot-android/paperpilot-project.zip.b64.part* | base64 --decode > /tmp/paperpilot-project.zip
          unzip -q /tmp/paperpilot-project.zip -d paperpilot-build
      - name: Compile debug APK
        working-directory: paperpilot-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK='paperpilot-build/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee APK_SIGNATURE_REPORT.txt
          mkdir -p artifact
          cp "$APK" artifact/PaperPilotAI-NVIDIA-Demo.apk
          sha256sum artifact/PaperPilotAI-NVIDIA-Demo.apk | tee artifact/PaperPilotAI-NVIDIA-Demo.apk.sha256
          cp APK_SIGNATURE_REPORT.txt artifact/
          printf 'Paper-only autonomous trading demo. No live broker execution.\n' > artifact/BUILD_SCOPE.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperPilotAI-NVIDIA-Android
          path: artifact/
          if-no-files-found: error
          retention-days: 1
