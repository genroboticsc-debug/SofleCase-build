name: CareerPilot Pro 2.1 Verified APK

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build verified CareerPilot 2.1 source
        shell: bash
        run: bash careerpilot_build/pro_v21_patch/build_pro21.sh
      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          cp build-src/CareerPilotAI/app/build/outputs/apk/debug/app-debug.apk CareerPilotAI-Pro-2.1.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          {
            echo '=== APK SIGNATURE ==='
            "$APKSIGNER" verify --verbose --print-certs CareerPilotAI-Pro-2.1.apk
            echo '=== APK PACKAGE METADATA ==='
            "$AAPT" dump badging CareerPilotAI-Pro-2.1.apk
            echo '=== APK SHA256 ==='
            sha256sum CareerPilotAI-Pro-2.1.apk
            echo '=== APK ZIP INTEGRITY ==='
            unzip -t CareerPilotAI-Pro-2.1.apk | tail -n 2
          } | tee CareerPilotAI-Pro-2.1.validation.txt | tee -a careerpilot-pro-21-build.log
          sha256sum CareerPilotAI-Pro-2.1.apk > CareerPilotAI-Pro-2.1.apk.sha256
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-2.1-build-diagnostics
          path: careerpilot-pro-21-build.log
          retention-days: 1
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilotAI-Pro-2.1-No-Key-Search-APK
          path: |
            CareerPilotAI-Pro-2.1.apk
            CareerPilotAI-Pro-2.1.apk.sha256
            CareerPilotAI-Pro-2.1.validation.txt
          if-no-files-found: error
          retention-days: 1
