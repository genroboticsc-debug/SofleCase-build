name: Cache build123d 0.11.1

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/cache-build123d-0.11.1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > requirements.txt <<'REQ'
          build123d==0.11.1
          cadquery-ocp-novtk==7.9.3.1.1
          cadquery-ocp-proxy==7.9.3.1.1
          manifold3d==3.5.2
          trimesh==4.11.1
          numpy==2.3.5
          svgpathtools==1.7.2
          svgelements==1.9.6
          ezdxf==1.4.2
          ocpsvg==0.6.0
          ocp_gordon==0.2.1
          trianglesolver==1.2
          lib3mf==2.4.1
          REQ
          python -m pip download --dest wheelhouse -r requirements.txt
          echo '4e95fa7ccbdc83e624313be492e7c4f5f0eb2ea1df36130eb718bb0c25a89e10  wheelhouse/build123d-0.11.1-py3-none-any.whl' | sha256sum --check --strict
          sha256sum wheelhouse/* | sort -k2 > wheelhouse/SHA256SUMS
      - name: Upload verified wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emtid000034210-python313-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
