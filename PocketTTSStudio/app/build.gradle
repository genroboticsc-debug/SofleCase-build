plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.genrobotics.pockettts'
    compileSdk 33

    defaultConfig {
        applicationId 'com.genrobotics.pockettts'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.3.2' }
    packagingOptions {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.5.aar')
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.activity:activity-compose:1.6.1'
    implementation 'androidx.compose.ui:ui:1.3.2'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.3.2'
    implementation 'androidx.compose.material:material:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    // 1.21 is sufficient for TAR+BZip2 extraction and avoids newer JVM bytecode
    // that old Android D8 versions can reject while dexing desktop-oriented helpers.
    implementation 'org.apache.commons:commons-compress:1.21'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.3.2'
}
